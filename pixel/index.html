<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Scarf Kid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one arcade screen, centered. Touch pads sit under it in portrait and float over its corners in landscape. */
:root{
  --void:#0d0a1a; --rim:#2a2046; --ink:#efe8ff; --muted:#9d93c2; --hair:#ff9ad0; --scarf:#e0342c; --suit:#3346e0; --energy:#5bc0ff;
  --pixel:'Silkscreen', ui-monospace, 'Courier New', monospace;
  --reserve:64px; --b:clamp(44px,13vw,60px);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--pixel);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{box-sizing:border-box;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#screen{position:relative;width:min(100%, calc((100vh - var(--reserve) - 20px) * 16 / 9));width:min(100%, calc((100dvh - var(--reserve) - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 16 / 9));max-width:100%}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000;box-shadow:0 0 0 2px #000,0 0 0 5px var(--rim),0 18px 50px rgba(0,0,0,.55);cursor:pointer;touch-action:none}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;font-size:11px;color:var(--muted);letter-spacing:.04em;max-width:100%}
.keys{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center}
kbd{font-family:var(--pixel);color:var(--ink);background:#1d1633;border:1px solid var(--rim);border-bottom-width:3px;padding:0 5px;border-radius:2px}
.tbtn{font:inherit;color:var(--ink);background:#1d1633;border:2px solid var(--rim);padding:3px 10px;cursor:pointer}
.tbtn.hi{border-color:var(--hair);color:#fff}
.tbtn:focus-visible,.pb:focus-visible{outline:2px solid var(--hair);outline-offset:2px}
.credit{color:var(--hair)}
#pad{display:none;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#stick{position:absolute;left:0;top:0;bottom:0;width:48%;touch-action:none}
#stick .base{position:absolute;left:var(--sx,30%);top:var(--sy,55%);width:var(--sr);height:var(--sr);margin:calc(var(--sr) / -2) 0 0 calc(var(--sr) / -2);border-radius:50%;border:3px solid rgba(255,255,255,.25);background:rgba(20,14,40,.45);opacity:.6}
#stick.on .base{opacity:1}
#stick .knob{position:absolute;left:50%;top:50%;width:46%;height:46%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffffff,#bfb4e6);box-shadow:0 3px 0 rgba(0,0,0,.45);transform:translate(-50%,-50%) translate(var(--kx,0px),var(--ky,0px))}
#stick .lbl{position:absolute;left:var(--sx,30%);top:calc(var(--sy,55%) + var(--sr) / 2 + 6px);transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.12em;pointer-events:none;white-space:nowrap}
#stick.on .lbl{display:none}
.btns{position:absolute;right:max(6px,env(safe-area-inset-right,0px));bottom:6px;width:calc(var(--b) * 3.7);height:calc(var(--b) * 3.3);touch-action:none}
.pb{position:absolute;font-family:var(--pixel);font-weight:700;font-size:12px;color:#fff;border:3px solid #000;border-radius:50%;width:var(--b);height:var(--b);box-shadow:0 4px 0 #000,inset 0 -5px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;touch-action:none;-webkit-user-select:none;user-select:none;line-height:1.05}
.pb small{display:block;font-size:8px;opacity:.9;margin-top:2px;max-width:92%;overflow:hidden;white-space:nowrap}
.pb.on{transform:translateY(3px);box-shadow:0 1px 0 #000,inset 0 -2px 0 rgba(0,0,0,.25);filter:brightness(1.35)}
.pb.atk{width:calc(var(--b) * 1.42);height:calc(var(--b) * 1.42);right:calc(var(--b) * .1);bottom:calc(var(--b) * .15);background:#d9468f;font-size:15px}
.pb.spc{right:calc(var(--b) * 1.72);bottom:calc(var(--b) * .05);background:#3346e0}
.pb.jmp{right:calc(var(--b) * .3);bottom:calc(var(--b) * 1.78);background:#6b54b0}
.pb.shd{right:calc(var(--b) * 1.58);bottom:calc(var(--b) * 1.4);background:#1b8f80;font-size:11px}
.pb.sup{right:calc(var(--b) * 2.75);bottom:calc(var(--b) * 2.15);width:calc(var(--b) * .85);height:calc(var(--b) * .85);background:#4a1820;opacity:.4;font-size:10px}
.pb.sup.ready{opacity:1;background:#e0342c;animation:pulse .5s steps(2) infinite}
@keyframes pulse{50%{filter:brightness(1.6)}}
@media (prefers-reduced-motion: reduce){.pb.sup.ready{animation:none}}
#tpause{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:8px;width:40px;height:34px;border-radius:8px;border:2px solid var(--rim);background:rgba(20,14,40,.7);color:#fff;font:700 14px var(--pixel);touch-action:manipulation}
#rot{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;white-space:nowrap;pointer-events:none}
/* Phones: the game sits on top and a gamepad fills the rest of the screen. Turned sideways, the game fills the screen and the pad floats over it. */
@media (hover:none) and (pointer:coarse){
  :root{--b:clamp(52px,15vw,70px);--sr:clamp(112px,34vw,150px)}
  #app{justify-content:flex-start;gap:0;padding:max(8px,env(safe-area-inset-top,0px)) 8px 0 8px}
  #screen{width:100%}
  .bar{display:none}
  #pad{display:block;position:relative;flex:1;width:100%;min-height:250px;margin-bottom:env(safe-area-inset-bottom,0px)}
  .btns{bottom:clamp(10px,calc(50% - var(--b) * 1.65),240px)}
  #stick{--sy:50%}
}
@media (hover:none) and (pointer:coarse) and (orientation:landscape){
  :root{--b:clamp(44px,13vh,62px);--sr:clamp(100px,30vh,140px)}
  #app{padding:0;justify-content:center}
  #screen{width:min(100vw,calc(100dvh * 16 / 9))}
  canvas{box-shadow:none}
  #pad{position:fixed;inset:0;min-height:0;margin:0;pointer-events:none}
  body:not(.playing) #pad{display:none}
  #stick,.btns,#tpause{pointer-events:auto}
  #stick{top:18%}
  .btns{bottom:6px}
  .pb{opacity:.82}.pb.sup{opacity:.35}.pb.sup.ready{opacity:.95}
  #rot{display:none}
}
</style>

<div id="app">
  <div id="screen"><canvas id="cv" role="img" aria-label="Scarf Kid game screen"></canvas></div>
  <div class="bar">
    <span class="keys"><span><kbd>A</kbd><kbd>D</kbd> or <kbd>←</kbd><kbd>→</kbd> move</span><span><kbd>Space</kbd>/<kbd>Z</kbd> jump</span><span><kbd>J</kbd>/<kbd>X</kbd> attack</span><span><kbd>K</kbd>/<kbd>C</kbd> special</span><span><kbd>L</kbd>/<kbd>V</kbd> shield</span><span><kbd>J</kbd>+<kbd>K</kbd> super</span></span>
    <button class="tbtn hi" id="helpBtn" type="button">How to play (H)</button>
    <button class="tbtn" id="mute" type="button">Sound on</button>
    <button class="tbtn" id="pauseBtn" type="button">Pause</button>
    <span class="credit">Hero sprite by Eames</span>
  </div>
  <div id="pad" aria-label="Touch controls">
    <div id="stick"><div class="base"><div class="knob"></div></div><span class="lbl">DRAG TO MOVE</span></div>
    <span id="rot">TURN YOUR PHONE SIDEWAYS FOR A BIGGER SCREEN</span>
    <button type="button" id="tpause" aria-label="Pause">II</button>
    <div class="btns">
      <button type="button" class="pb sup" data-k="super">SUPER</button>
      <button type="button" class="pb shd" data-k="shield">SHIELD</button>
      <button type="button" class="pb jmp" data-k="jump">JUMP</button>
      <button type="button" class="pb spc" data-k="special">SPECIAL<small id="spcName">SHOT</small></button>
      <button type="button" class="pb atk" data-k="attack">ATTACK</button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const W=480,H=270,SC=2,GRAV=.5,SPARKWIN=12;
const STAGE={main:{x0:84,x1:396,y:196,bot:222},soft:[{x0:118,x1:200,y:142},{x0:280,x1:362,y:142},{x0:200,x1:280,y:90}]};
const BL={l:-110,r:W+110,t:-160,b:H+90};
const PIXEL=true;   // build flag: the pixel version is this same file with PIXEL=true
const DPR=2;   // canvas is drawn at 1920x1080 for a sharp look
const cv=document.getElementById('cv');cv.width=W*SC*DPR;cv.height=H*SC*DPR;
const MAIN=cv.getContext('2d');MAIN.imageSmoothingEnabled=!PIXEL;MAIN.imageSmoothingQuality='high';
let ctx=MAIN,K=DPR;
const ST=(a,b,c,d,e,f)=>ctx.setTransform(a*K,b*K,c*K,d*K,e*K,f*K);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let TOUCH=matchMedia('(hover: none) and (pointer: coarse)').matches;
const R=Math.random,rr=(a,b)=>a+R()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------------- audio ---------------- */
let AC=null,NB=null,muted=false;
try{muted=localStorage.getItem('scarfkid-muted')==='1'}catch(e){}
function audio(){if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(A){try{AC=new A()}catch(e){}}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}
function tone(f0,f1,dur,type,vol,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);}
function noise(dur,vol,freq,delay){if(!AC||muted)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5|0,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=.8;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur+.02);}
const SFX={
  whiff:()=>noise(.07,.07,2600),
  hit:()=>{noise(.09,.28,1000);tone(190,70,.1,'square',.1)},
  heavy:()=>{noise(.16,.38,520);tone(130,40,.18,'square',.14)},
  launch:()=>{noise(.35,.4,380);tone(110,30,.4,'sawtooth',.15)},
  block:()=>{noise(.05,.18,3800);tone(1000,700,.05,'triangle',.07)},
  blast:()=>tone(260,880,.22,'sawtooth',.07),
  spark:()=>{noise(.4,.5,280);tone(90,30,.45,'sawtooth',.22);tone(1800,240,.28,'square',.07)},
  super:()=>{tone(180,1400,.55,'sawtooth',.09);noise(.5,.15,1600)},
  ko:()=>{tone(420,40,.9,'square',.14);noise(.7,.32,380)},
  blip:()=>tone(660,660,.06,'square',.07),
  go:()=>{tone(523,523,.09,'square',.09);tone(784,784,.16,'square',.09,.1)},
  count:()=>tone(440,440,.1,'square',.08),
  jump:()=>tone(240,480,.08,'triangle',.05),
  djump:()=>tone(360,720,.09,'triangle',.05),
  tele:()=>tone(1400,180,.22,'sine',.1),
  win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,f,.14,'square',.08,i*.12)),
  shield:()=>tone(700,520,.05,'triangle',.05),
  roll:()=>noise(.12,.08,1600),
  grab:()=>tone(300,200,.06,'square',.07),
  throw:()=>{noise(.12,.2,700);tone(200,90,.12,'square',.08)},
  tech:()=>tone(900,1500,.08,'square',.06),
  ledge:()=>tone(500,760,.05,'triangle',.06),
  brk:()=>{tone(800,100,.5,'sawtooth',.12);noise(.4,.3,2000)},
  counter:()=>{tone(1200,300,.15,'square',.1);noise(.1,.2,3000)},
  charge:()=>tone(300+R()*200,300,.03,'triangle',.03),
  dash:()=>noise(.06,.06,1200),
  check:()=>{tone(784,784,.06,'square',.07);tone(1175,1175,.1,'square',.07,.07)},
};

/* ---------------- characters ----------------
   run/dash/air in px per frame (stage is 312px wide), jump = takeoff speed, rise = up-special speed.
   power = stars, only used when POWER SCALING is set to CANON. */
const HEADMAPS={
 kid:["..p..p..p...",".pppppppppp.","pppPppPpppp.",".ppppppppppp","oopppppppp..","ooyyyyyyyy..","ooyyyyywey..","ooyyyyyyyy..","ooyyyyyyyyy.",".oyyyykkkk..",".oyyyyyyyy..","..yyyyyyy..."],
 gloop:["....gggg....","..gggggggg..",".gggggggggg.",".gggggwwwgg.","ggggwwwkkwg.","ggggwwwkkwg.","gggggwwwwgg.","gggggggggggg","ggGwGwGwGwGg",".gGGGGGGGGg.","..gggggggg.."],
 hollow:["...hhhhhh...","..hhmmmmmh..",".hhmmmmmmmm.",".hmmmmmmkkm.",".hmmmmmkkkm.",".hmmmmmmkkm.",".hmmmmmmmmm.",".hmmmmmmmrm.",".hhmmmkkkkm.","..hmmmmmmm..","...hmmmmm..."],
 ironjaw:["b........b..","bb.rrrrr.bb.",".brrrrrrrrb.","..rrrrrrrrr.","..rrrRRyyrr.","..rrrrrrrrr.",".jjjjjjjjjj.",".jwjwjwjwjjj",".jjjjjjjjjj.","..jjjjjjjj.."],
 zenith:[".aaaaaaaa...","a........a..",".aaaaaaaa...","..hhhhhhh...",".hhhhhhhhhh.",".hsssssssh..",".hssssssess.",".hsssssss...",".hssssssss..","..ssskkks...","..sssssss...","...sssss...."],
};
const CHARS={
 kid:{id:'kid',sp:['ENERGY SHOT','RUSH FIST','RISING FIST','COUNTER'],name:'SCARF KID',power:3,s:1,tw:9,lw:4,run:3.4,dash:3.9,air:2.8,airAcc:.34,jump:9.6,grav:1,fall:6.6,weight:98,dm:1,jumps:1,rise:10.4,sdash:6.6,
   col:{top:'#2b3fd8',topD:'#1d2a9c',pants:'#2b3fd8',pantsD:'#1d2a9c',hand:'#f6cfb2',cuff:'#d8322b',shoe:'#d8322b',shoeTop:'#1a1a1a',belt:'#141414',scarf:'#d8322b',scarfD:'#9e1f1a'},
   hpal:{p:'#ff9ad0',P:'#e06aa8',y:'#f2d74e',o:'#d9822b',w:'#ffffff',e:'#ff7a1a',k:'#1a1a1a'},
   proj:{v:4.6,r:5,col:'#5bc0ff',core:'#e8f7ff',cd:40,life:110},aura:'#5bc0ff',sup:'FINAL FIST',
   desc:['All-rounder with fast hands.','Land a jab, then → + attack','instantly for a SPARK.']},
 gloop:{id:'gloop',sp:['BLOB SHOT','BELLY SLIDE','BOUNCE UP','COUNTER'],name:'GLOOP',power:2,s:1.12,tw:14,lw:5,run:2.6,dash:3.1,air:2.4,airAcc:.3,jump:8.6,grav:.8,fall:5.2,weight:126,dm:1.1,jumps:2,rise:9.4,sdash:5.4,
   col:{top:'#43b34e',topD:'#2c7d35',pants:'#33923d',pantsD:'#22632a',hand:'#86e88a',shoe:'#1d5424'},
   hpal:{g:'#5fd16a',G:'#2a7a33',w:'#f6ffe8',k:'#0b1a0d'},
   proj:{v:2.8,r:8,col:'#6ee06a',core:'#d9ffd0',cd:60,life:130},aura:'#6ee06a',sup:'BIG GULP',
   desc:['Heavy and floaty. 3 jumps.','Very hard to launch.','Slow, fat blob shots.']},
 hollow:{id:'hollow',sp:['BLINK','DASH CUT','UPDRAFT','COUNTER'],name:'HOLLOW',power:3,s:1.08,tw:7,lw:3,run:4.3,dash:4.8,air:3.2,airAcc:.38,jump:10.2,grav:1.1,fall:7.4,weight:84,dm:.92,jumps:1,rise:10.8,sdash:7.6,tele:true,
   col:{top:'#3d3159',topD:'#271f3b',pants:'#3d3159',pantsD:'#271f3b',hand:'#ddd6ea',shoe:'#130f1d',belt:'#c23a5a'},
   hpal:{h:'#281f3d',m:'#f1ece0',k:'#120d1c',r:'#c23a5a'},
   aura:'#c9b8ff',sup:'NO FACE',
   desc:['Fastest fighter, but light.','Special teleports it','right behind you.']},
 ironjaw:{id:'ironjaw',sp:['FIREBALL','IRON RUSH','RISING MAW','COUNTER'],name:'IRONJAW',power:5,s:1.22,tw:12,lw:5,run:2.9,dash:3.4,air:2.5,airAcc:.3,jump:9.2,grav:1.12,fall:7.4,weight:120,dm:1.2,jumps:1,rise:10,sdash:6.2,
   col:{top:'#7d1d1d',topD:'#511212',pants:'#2b2b30',pantsD:'#1b1b1f',hand:'#b9b9c6',cuff:'#c9a227',shoe:'#121214',belt:'#c9a227'},
   hpal:{b:'#e8e0d0',r:'#8e2020',R:'#5e1010',y:'#ffd23d',j:'#9a9aa8',w:'#ffffff'},
   proj:{v:5.4,r:5,col:'#ff6a2a',core:'#fff0a0',cd:50,life:100},aura:'#ff6a2a',sup:'IRON MAW',
   desc:['Slow and huge.','Hits like a truck.','Fast fireballs.']},
 zenith:{id:'zenith',sp:['PULL ORB','FLASH STEP','ASCEND','COUNTER'],name:'ZENITH',power:6,s:1.04,tw:9,lw:4,run:3.5,dash:4.1,air:3,airAcc:.36,jump:9.8,grav:.95,fall:6.4,weight:92,dm:1,jumps:1,rise:11,sdash:7,deflect:true,
   col:{top:'#e9e4ff',topD:'#b3a9e0',pants:'#1d1a33',pantsD:'#12101f',hand:'#efe6f5',cuff:'#ffd23d',shoe:'#111018',belt:'#ffd23d'},
   hpal:{a:'#ffd23d',h:'#14303a',s:'#efe6f5',e:'#4ff0ff',k:'#1a1a1a'},
   proj:{v:1.8,r:9,col:'#4f7bff',core:'#d8f6ff',cd:110,life:150,pull:true},aura:'#4ff0ff',sup:'ZERO SPACE',
   desc:['The strongest. 6 stars.','Shots bounce right off it.','Its orb pulls you in.']},
};
const ROSTER=['kid','gloop','hollow','ironjaw','zenith'];
for(const id of ROSTER) CHARS[id].head=HEADMAPS[id];

/* ---------------- poses ---------------- */
const U0={hip:[0,-22],neck:[1,-37],head:[2,-44],fe:[7,-30],fh:[11,-35],be:[-2,-29],bh:[5,-33],fk:[6,-11],ff:[8,0],bk:[-4,-11],bf:[-7,0]};
const pose=o=>{const p={};for(const k in U0)p[k]=(o[k]||U0[k]).slice();return p;};
const POSES={
 idle0:pose({}),
 idle1:pose({hip:[0,-21],neck:[1,-36],head:[2,-43],fe:[7,-29],fh:[11,-34],be:[-2,-28],bh:[5,-32],fk:[6,-10],bk:[-4,-10]}),
 walk0:pose({hip:[1,-23],neck:[4,-37],head:[5,-44],fk:[4,-11],ff:[3,0],bk:[0,-11],bf:[-1,0]}),
 walk1:pose({hip:[1,-22],neck:[5,-36],head:[6,-43],fe:[9,-31],fh:[14,-34],be:[-6,-30],bh:[-9,-26],fk:[9,-12],ff:[14,-2],bk:[-5,-9],bf:[-12,-3]}),
 walk2:pose({hip:[1,-22],neck:[5,-36],head:[6,-43],fe:[-2,-31],fh:[-6,-27],be:[8,-31],bh:[13,-34],fk:[-3,-11],ff:[-10,-2],bk:[6,-12],bf:[12,-1]}),
 jump:pose({hip:[0,-24],neck:[1,-39],head:[2,-46],fe:[6,-35],fh:[10,-41],be:[-5,-33],bh:[-3,-40],fk:[7,-20],ff:[3,-11],bk:[-2,-18],bf:[-7,-10]}),
 fall:pose({hip:[0,-24],neck:[0,-39],head:[1,-46],fe:[6,-44],fh:[8,-50],be:[-6,-43],bh:[-8,-49],fk:[5,-14],ff:[6,-3],bk:[-4,-14],bf:[-5,-3]}),
 punch:pose({hip:[1,-22],neck:[4,-37],head:[5,-44],fe:[13,-35],fh:[21,-36],be:[-1,-30],bh:[5,-34],fk:[8,-11],ff:[11,0],bk:[-4,-11],bf:[-8,0]}),
 punch2:pose({hip:[1,-22],neck:[5,-37],head:[6,-44],fe:[6,-31],fh:[9,-36],be:[13,-34],bh:[22,-35],fk:[8,-11],ff:[12,0],bk:[-5,-10],bf:[-9,0]}),
 chamber:pose({hip:[0,-23],neck:[-1,-38],head:[0,-45],fe:[5,-32],fh:[9,-37],be:[-5,-31],bh:[0,-35],fk:[8,-20],ff:[6,-10],bk:[-3,-11],bf:[-4,0]}),

/* ---------------- drawing helpers (HD: smooth vector art) ---------------- */
const OUT='#140d22';
const SHADE={};
function shade(hex,amt){const k=hex+amt;if(SHADE[k])return SHADE[k];if(hex[0]!=='#'||hex.length!==7)return hex;const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.round(clamp(amt>0?v+(255-v)*amt:v*(1+amt),0,255));return SHADE[k]='#'+((1<<24)|(f(r)<<16)|(f(g)<<8)|f(b)).toString(16).slice(1);}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`;}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function disc(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}

function txt(s,x,y,size,col,align,stroke){ctx.font=fontFor(size);ctx.textAlign=align||'center';ctx.textBaseline='middle';if(stroke!==false){ctx.lineWidth=Math.max(3,size/5);ctx.strokeStyle='#0b0614';ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=col;ctx.fillText(s,x,y);}

let HO=OUT;

function oval(x,y,rx,ry,col,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);fs(col);}
function poly(pts,col){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();fs(col);}

function drawWorldPx(ox,oy,z,pz){

  const min=11*(a.c.s+b.c.s)/2,dx=b.x-a.x;

}

function targetPose(f){
  const m=f.move;
  switch(f.state){
    case'idle':case'revive':return(Math.floor(G.frame/24)%2)?'idle1':'idle0';
    case'run':return['walk1','walk0','walk2','walk0'][Math.floor(G.frame/4)%4];
    case'crouch':case'squat':case'land':case'roll':case'spot':return'crouch';
    case'air':return f.vy<0?'jump':'fall';
    case'helpless':case'airdodge':return'fall';
    case'shield':case'shieldstun':return'guard';
    case'hit':case'held':case'dizzy':return'hit';
    case'holding':return'punch';
    case'ledge':return'ledge';
    case'win':return'win';
    case'attack':return f.t<m.st?m.p0:(f.t<m.st+Math.min(m.ac,30)+Math.ceil(m.rc*.6)||m.air&&f.t<m.st+m.ac)?m.p1:(f.onGround?'idle0':'jump');
  }

}
function updPose(f){const tp=POSES[targetPose(f)],k=f.state==='attack'||f.state==='run'?.6:.35;for(const key in tp){const a=f.pose[key],b=tp[key];a[0]+=(b[0]-a[0])*k;a[1]+=(b[1]-a[1])*k;}}

/* ---------------- AI ---------------- */
function tap(f,b){f.latch[b]=true;}
function aiThink(me,op){
  const A=me.ai,P=A.P,h=me.inp;for(const k of BTN)h[k]=false;
  if(me.state==='dead'||G.phase!=='fight')return;
  const M=STAGE.main,mid=(M.x0+M.x1)/2,dx=op.x-me.x,dist=Math.abs(dx),dy=op.y-me.y;
  const toward=dx>0?'right':'left',away=dx>0?'left':'right',home=me.x<mid?'right':'left';
  const fdir=Math.sign(dx)||1;
  if(me.state==='revive'){if(me.t>30&&R()<.06)tap(me,'down');return;}
  if(me.state==='ledge'){if(me.t>8&&R()<.08){const r=R();if(r<.35)press(me,'jump');else if(r<.6)press(me,'attack');else if(r<.8)press(me,'shield');else tap(me,home);}return;}
  if(me.state==='holding'){const r=R();if(r<.35)h[toward]=true;else if(r<.6)h.up=true;else if(r<.8)h.down=true;else h[away]=true;return;}
  if(me.state==='dizzy'){if(R()<.3)tap(me,'left');return;}
  // shield punish: grab or up smash an attacker that whiffed into our shield
  if(me.state==='shield'||me.state==='shieldstun'){const om=op.move;if(op.state==='attack'&&om&&op.t>om.st+om.ac&&dist<34&&R()<P.acc){h.shield=true;press(me,'attack');A.hold=0;return;}}
  if(A.hold>0){A.hold--;Object.assign(h,A.held);return;}
  const hold=(o,n)=>{A.held=o;A.hold=n;Object.assign(h,o);};
  // recovery
  const off=!me.onGround&&(me.x<M.x0-2||me.x>M.x1+2||me.y>M.y+2);
  if(off&&me.state!=='hit'){
    if(A.willRecover==null)A.willRecover=R()<P.recover;
    if(A.willRecover){
      h[home]=true;
      const edgeX=me.x<mid?M.x0:M.x1,hd=Math.abs(me.x-edgeX);
      if(me.state==='air'&&me.vy>-1.5){
        if(me.y>M.y-30&&me.jumps>0)press(me,'jump');
        else if(!me.sideUsed&&hd>90&&me.y<M.y+40&&me.jumps===0)press(me,'special');
        else if(!me.risen&&me.y>M.y+14&&me.jumps===0){h.up=true;press(me,'special');}
      }
      return;
    }
  }
  if(me.onGround)A.willRecover=null;
  // combo / charge follow-through
  if(me.state==='attack'){
    if(me.move.charge&&me.chargeT<A.chargeWant)h.attack=true;
    if(me.connected&&A.combo.length&&G.frame-me.hitFrame>=A.combo[0].d){const n=A.combo.shift();Object.assign(h,n.h||{});press(me,n.b);}
    return;
  }
  A.combo=[];
  // react to threats
  const om=op.move,opAtk=op.state==='attack'&&om&&om.hb&&op.t<om.st+om.ac&&dist<(om.dash||om.slide?110:62)&&Math.abs(dy)<60;
  const projIn=G.projs.some(p=>p.owner===op&&Math.sign(me.x-p.x)===Math.sign(p.vx)&&Math.abs(p.x-me.x)<100&&Math.abs(p.y-(me.y-24))<30);
  if((opAtk||projIn)&&A.react==null){const r=R();A.react=r<P.shield*.7?'shield':r<P.shield?(R()<.5?'jump':'counter'):'none';A.reactAt=G.frame+P.react;}
  else if(!opAtk&&!projIn&&A.react!=null&&G.frame>A.reactAt+6)A.react=null;
  if(A.react&&A.react!=='none'&&A.react!=='done'&&G.frame>=A.reactAt&&me.onGround&&(me.state==='idle'||me.state==='run'||me.state==='crouch')){
    if(A.react==='shield'){hold({shield:true},10+R()*12|0);}
    else if(A.react==='jump'){hold({jump:true,[away]:true},6);press(me,'jump');}
    else{h.down=true;press(me,'special');}
    A.react='done';return;
  }
  if(!['idle','run','crouch','air','shield'].includes(me.state))return;
  const opGone=op.state==='dead'||op.state==='revive';
  const opOn=op.x>M.x0-6&&op.x<M.x1+6;
  // in the air: drift toward and swing

    if(!opGone&&opOn&&dist>10)h[toward]=true;
    if(me.x<M.x0+12)h.right=true,h.left=false;else if(me.x>M.x1-12)h.left=true,h.right=false;
    if(!opGone&&dist<34&&Math.abs(dy+12)<44&&R()<P.acc*.35){
      if(dy<-26){h.up=true;h.left=h.right=false;}else if(dy>22){h.down=true;h.left=h.right=false;}
      else{h.left=h.right=false;h[toward]=true;}
      press(me,'attack');
    }

  }

    else if(A.plan==='retreat'){if(edgeDanger(away))A.planT=0;else h[away]=true;}
    else if(A.plan==='dash'){h[toward]=true;if(dist<56&&me.runT>10){press(me,'attack');A.planT=0;}if(edgeDanger(toward))A.planT=0;}
    else if(A.plan==='home'){if(Math.abs(me.x-mid)<30)A.planT=0;else h[me.x<mid?'right':'left']=true;}

  if(op.y<me.y-40&&dist<60&&R()<.5){hold({jump:true},8);press(me,'jump');return;}
  if(op.y>me.y+30&&me.onSoft&&R()<.5){tap(me,'down');return;}
  if(me.meter>=100&&dist<110&&Math.abs(dy)<24&&R()<.6){if(me.face!==fdir){h[toward]=true;return;}press(me,'super');return;}
  if(dist>110){

    if(me.c.tele&&me.projCD<=0&&R()<.25&&op.onGround){press(me,'special');return;}
    if(R()<P.aggro+.25)set(R()<.3?'dash':'approach',20+R()*30);else set('home',10);
  }else if(dist>34){
    const r=R();
    if(r<P.aggro*.35){hold({jump:R()<.5,[toward]:true},10);press(me,'jump');}
    else if(r<P.aggro*.55)set('dash',30);
    else if(r<P.aggro*.65&&!me.c.tele){h[toward]=true;press(me,'special');}
    else if(r<P.aggro)set('approach',8+R()*14);
    else if(r<.85)hold({shield:true},10+R()*14|0);

      else if(dy<-24){h.up=true;press(me,'attack');}
      else if(op.pct>85&&R()<.6){h[toward]=true;press(me,'attack');}
      else if(R()<.25){h.down=true;press(me,'attack');}
      else if(R()<.7){
        if(me.face!==fdir){h[toward]=true;return;}
        press(me,'attack');

      }else{h.shield=true;press(me,'attack');}
    }else if(r<P.aggro+.15)hold({shield:true},12+R()*14|0);
    else set('retreat',10+R()*12);
  }
}

/* ---------------- flow ---------------- */
function aiFor(lvl){return{P:LEVELS[lvl],cool:40,plan:null,planT:0,combo:[],react:null,reactAt:0,willRecover:null,hold:0,held:{},chargeWant:0};}
function setupFighters(id1,id2){
  G.f=[mkFighter(id1,0),mkFighter(id2,1)];G.p=G.f[0];G.e=G.f[1];
  G.p.human=true;
}
function startArcade(){
  G.pick=ROSTER[G.sel[0]];
  G.ladder=ROSTER.filter(id=>id!==G.pick).sort((a,b)=>CHARS[a].power-CHARS[b].power);
  G.stats={sparks:0,maxCombo:0,kos:0,continues:0,start:performance.now()};
  startMatch(0);
}
function startMatch(i){
  G.stage=i;setupFighters(G.pick,G.ladder[i]);G.e.ai=aiFor(i);
  G.phase='intro';G.t=0;
}
function startVersus(){
  G.stage=(R()*STAGES.length)|0;setupFighters(ROSTER[G.sel[0]],ROSTER[G.sel[1]]);
  const pads=padCount();
  if(TOUCH&&pads<2&&!sawKeys)G.e.ai=aiFor(1);else G.e.human=true;
  startFight();
}
function startTraining(){
  G.stage=0;setupFighters(ROSTER[G.sel[0]],G.sel[0]===1?'kid':'gloop');G.train={};
  startFight();
}
function startFight(){
  const M=STAGE.main;
  for(const [f,x,face] of [[G.p,M.x0+80,1],[G.e,M.x1-80,-1]])Object.assign(f,{x,y:M.y,vx:0,vy:0,face,onGround:true,onSoft:false,state:'idle',t:0,pct:0,shownPct:0,stocks:3,meter:0,hidden:false,inv:0,buf:null,tail:null,jumps:f.c.jumps,shield:100});
  G.projs=[];G.parts=[];G.bolts=[];G.texts=[];G.kofx=[];G.combo=null;G.stop=0;G.slow=0;G.freeze=0;G.winner=null;G.fightT=0;
  G.phase='ready';G.t=0;updCam(true);
}
function afterKO(){
  G.phase='result';G.t=0;G.rmenu=0;
  if(G.mode==='arcade')G.res=G.winner===G.p?'win':'lose';
  else G.res=G.winner===G.p?'p1':'p2';
  if(G.res!=='lose')SFX.win();
}

function updCam(snap){
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity,n=0;
  if(G.freeze>0&&G.freezeBy){const f=G.freezeBy;x0=x1=f.x;y0=f.y-50;y1=f.y;n=1;}
  else for(const f of G.f){if(f.state==='dead'||f.hidden)continue;n++;const fx=clamp(f.x,BL.l+60,BL.r-60),fy=clamp(f.y,BL.t+60,BL.b-30);x0=Math.min(x0,fx);x1=Math.max(x1,fx);y0=Math.min(y0,fy-50);y1=Math.max(y1,fy);}
  if(!n){x0=STAGE.main.x0;x1=STAGE.main.x1;y0=110;y1=196;}
  const cx=(x0+x1)/2*.8+W/2*.2,cy=(y0+y1)/2*.8+150*.2;
  const span=Math.max((x1-x0)+170,((y1-y0)+120)*W/H);
  const z=clamp(W/span,1,G.freeze>0?1.9:1.6)+cam.kick;
  const hw=W/2/z,hh=H/2/z;
  const tx=clamp(cx,hw-30,W-hw+30),ty=clamp(cy,hh-70,H-hh);
  const k=snap?1:.1;cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;cam.z+=(z-cam.z)*(snap?1:.07);cam.kick*=.86;
}
function WS(x,y){return[SC*(W/2+(x-cam.x)*cam.z),SC*(H/2+(y-cam.y)*cam.z)];}

function step(){
  G.frame++;G.t++;
  if(G.white>0)G.white--;if(G.neg>0)G.neg--;
  G.shake=G.shake>.3?G.shake*.86:0;
  for(const t of G.texts){t.life--;t.y+=t.vy*(t.screen?SC:1);}G.texts=G.texts.filter(t=>t.life>0);
  for(const b of G.bolts)b.life--;G.bolts=G.bolts.filter(b=>b.life>0);
  for(const k of G.kofx)k.t++;G.kofx=G.kofx.filter(k=>k.t<26);
  if(G.combo&&--G.combo.t<=0)G.combo=null;
  if(G.paused||G.howto!=null){G.t--;return;}
  const ph=G.phase;
  if(ph==='title'||ph==='select'||ph==='ending')return;
  if(ph==='intro'){if(G.t>200)startFight();return;}
  if(ph==='result'){updParts();return;}
  if(G.freeze>0){G.freeze--;const f=G.freezeBy;updPose(f);if(G.freeze%2)G.parts.push({x:f.x+rr(-10,10),y:f.y-rr(0,40),vx:0,vy:-1.2,life:14,max:14,col:f.c.aura,size:2,grav:0});updParts();updCam();return;}
  if(G.stop>0){G.stop--;return;}
  if(G.slow>0){G.slow--;if(G.slow%3){updCam();return;}}
  const live=ph==='fight';
  if(live){G.fightT++;for(const f of G.f)if(f.ai)aiThink(f,other(f));if(G.mode==='training')G.p.meter=Math.min(100,G.p.meter+.5);}
  updFighter(G.p,G.e,live);if(G.phase!=='ko'||G.e.state!=='dead')updFighter(G.e,G.p,live);
  separate(G.p,G.e);
  updProjs();updParts();
  for(const f of G.f)f.shownPct+=(f.pct-f.shownPct)*.3;
  updCam();
  if(ph==='ready'){if(G.t===20||G.t===50||G.t===80)SFX.count();if(G.t===110)SFX.go();if(G.t>=110){G.phase='fight';G.t=0;}}
  else if(ph==='ko'){if(G.t===70&&G.winner&&G.winner.state!=='dead'&&G.winner.onGround)G.winner.state='win';if(G.t>=160)afterKO();}
}

  txt(`PAGE ${G.howto+1} OF ${HOWTO.length}  ·  ${TOUCH?'TAP TO FLIP':'← → TO FLIP'}`,480,64,10,'#9d93c2','center',false);
  if(P.rows){
    txt('ACTION',60,96,11,'#9d93c2','left',false);txt('KEYBOARD',450,96,11,'#9d93c2','left',false);txt('PHONE',730,96,11,'#9d93c2','left',false);
    P.rows.forEach((r,i)=>{const y=124+i*33;if(i%2){ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(50,y-15,860,30);}txt(r[0],60,y,11,'#ffffff','left',false);txt(r[1],450,y,12,'#ff9ad0','left',false);txt(r[2],730,y,12,'#7fe0ff','left',false);});
  }else if(P.chars){
    ['','SPECIAL','→ + SPECIAL','↑ + SPECIAL','↓ + SPECIAL'].forEach((h,i)=>txt(h,i?140+i*160:60,98,11,'#9d93c2',i?'center':'left',false));
    ROSTER.forEach((id,r)=>{const c=CHARS[id],y=136+r*68;if(r%2){ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(50,y-30,860,60);}portrait(c,90,y,40,1);txt(c.name,124,y,13,'#ffffff','left',false);c.sp.forEach((n,i)=>txt(n,300+i*160,y,12,i===0?'#ffe9a8':'#cfc6ef','center',false));});
  }else{
    let y=104;for(const [h,b] of P.blocks){txt(h,80,y,15,'#ff9ad0','left',false);y=wrap(b,80,y+24,800,12,'#efe8ff',20)+10;}
  }
  txt(P.foot,480,512,12,'#ffe9a8');
}
function drawPause(){
  ctx.fillStyle='rgba(8,4,20,.7)';ctx.fillRect(0,0,960,540);txt('PAUSED',480,170,60,'#ffffff');
  PMENU().forEach((m,i)=>txt((G.pmenu===i?'▶ ':'  ')+m,480,260+i*40,20,G.pmenu===i?'#ffffff':'#9d93c2'));
  txt(TOUCH?'TAP AN OPTION':'↑ ↓ CHOOSE · J SELECT · ESC RESUME',480,470,12,'#cfc6ef');
}
const PMENU=()=>['RESUME','HOW TO PLAY',G.mode==='training'?'RESET %':'RESTART FIGHT','QUIT TO MENU'];
function drawTexts(){
  for(const t of G.texts){ctx.globalAlpha=Math.min(1,t.life/10);if(t.screen)txt(t.s,t.x,t.y,t.size,t.col);else{const [sx,sy]=WS(t.x,t.y);txt(t.s,sx,sy,t.size,t.col);}}
  ctx.globalAlpha=1;
}

let lastPad='';
function syncPad(){
  const f=G.p,fighting=(G.phase==='fight'||G.phase==='ready'||G.phase==='ko')&&!G.paused&&G.howto==null;
  const k=(fighting&&f&&f.meter>=100?'s':'')+'|'+(fighting?'p':'')+'|'+(f?f.c.sp[0]:'');
  if(k===lastPad)return;lastPad=k;
  document.querySelector('.pb.sup').classList.toggle('ready',fighting&&f&&f.meter>=100);
  document.body.classList.toggle('playing',fighting);
  document.getElementById('spcName').textContent=f?f.c.sp[0]:'SHOT';
}

function render(){
  ST(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,960,540);
  const ph=G.phase;
  if(ph==='title')drawTitle();else if(ph==='select')drawSelect();else if(ph==='intro')drawIntro();else if(ph==='ending')drawEnding();else drawArena();
  if(ph!=='title'&&ph!=='select'&&ph!=='intro'&&ph!=='ending')drawTexts();
  if(G.paused)drawPause();
  if(G.howto!=null)drawHowto();
  syncPad();
}

/* ---------------- input ---------------- */
function goTitle(){G.phase='title';G.t=0;G.paused=false;pauseBtn.textContent='Pause';}
function setPause(v){G.paused=v;G.pmenu=0;pauseBtn.textContent=v?'Resume':'Pause';}
function openHowto(){G.howto=0;SFX.blip();}
function onPress(pl,btn){
  audio();
  let tapJump=true;if(btn==='stickup'){btn='up';tapJump=false;}
  if(btn==='help'){if(G.howto==null)openHowto();else G.howto=null;return;}
  if(G.howto!=null){
    if(btn==='left'||btn==='up'){G.howto=Math.max(0,G.howto-1);SFX.blip();}
    else if(btn==='right'||btn==='down'||btn==='tap'){if(G.howto<HOWTO.length-1){G.howto++;SFX.blip();}else if(btn==='tap')G.howto=null;}
    else if(btn==='attack'||btn==='start'||btn==='jump'){if(G.howto<HOWTO.length-1)G.howto++;else G.howto=null;SFX.blip();}
    else if(btn==='special'||btn==='pause')G.howto=null;
    return;
  }
  if(btn==='pause'){
    if(G.phase==='fight'||G.phase==='ready'){setPause(!G.paused);return;}
    if(G.phase==='select'){goTitle();return;}
    return;
  }
  if(G.paused){
    const n=PMENU().length;
    if(btn==='up'){G.pmenu=(G.pmenu+n-1)%n;SFX.blip();}
    else if(btn==='down'){G.pmenu=(G.pmenu+1)%n;SFX.blip();}
    else if(btn==='attack'||btn==='start'||btn==='jump')pauseSelect(G.pmenu);
    else if(btn==='special')setPause(false);
    return;
  }
  const ok=btn==='attack'||btn==='start'||(btn==='jump'&&G.phase!=='fight');
  switch(G.phase){
    case'title':
      if(btn==='up'){G.menu=(G.menu+3)%4;SFX.blip();}
      else if(btn==='down'){G.menu=(G.menu+1)%4;SFX.blip();}
      else if(ok)chooseMenu(G.menu);
      break;
    case'select':{
      const two=G.mode==='versus',p=two?pl:0;
      if(btn==='left'&&!G.lock[p]){G.sel[p]=(G.sel[p]+ROSTER.length-1)%ROSTER.length;SFX.blip();}
      else if(btn==='right'&&!G.lock[p]){G.sel[p]=(G.sel[p]+1)%ROSTER.length;SFX.blip();}
      else if(btn==='shield'){G.scale=G.scale==='canon'?'balanced':'canon';SFX.blip();}
      else if(btn==='special'){if(G.lock[p]){G.lock[p]=false;SFX.blip();}else goTitle();}
      else if(ok&&G.t>8){G.lock[p]=true;SFX.blip();if(!two||(G.lock[0]&&G.lock[1]))beginMode();}
      break;}
    case'intro':if(ok&&G.t>30)startFight();break;
    case'result':
      if(G.t<40)break;
      if(G.mode==='arcade'){if(ok){if(G.res==='win'){if(G.stage<G.ladder.length-1)startMatch(G.stage+1);else{G.phase='ending';G.t=0;SFX.win();}}else{G.stats.continues++;startMatch(G.stage);}}}
      else{
        if(btn==='up'){G.rmenu=(G.rmenu+2)%3;SFX.blip();}else if(btn==='down'){G.rmenu=(G.rmenu+1)%3;SFX.blip();}
        else if(ok)resultSelect(G.rmenu);
      }
      break;
    case'ending':if(ok&&G.t>60)goTitle();break;
    case'fight':{const f=G.f[pl];if(f&&f.human)press(f,btn,tapJump);break;}
  }
}
function chooseMenu(i){
  SFX.blip();
  if(i===3){openHowto();return;}
  G.mode=['arcade','versus','training'][i];G.lock=[false,false];G.phase='select';G.t=0;
}
function beginMode(){SFX.go();if(G.mode==='arcade')startArcade();else if(G.mode==='versus')startVersus();else startTraining();}
function pauseSelect(i){
  SFX.blip();
  if(i===0)setPause(false);
  else if(i===1)openHowto();
  else if(i===2){if(G.mode==='training'){G.p.pct=G.e.pct=0;setPause(false);}else{setPause(false);if(G.mode==='arcade')startMatch(G.stage);else startFight();}}
  else goTitle();
}
function resultSelect(i){if(i===0)startVersus();else if(i===1){G.lock=[false,false];G.phase='select';G.t=0;}else goTitle();}

const KEYS1P={KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',Space:'jump',KeyZ:'jump',KeyJ:'attack',KeyX:'attack',KeyK:'special',KeyC:'special',KeyL:'shield',KeyV:'shield',ShiftLeft:'shield',ShiftRight:'shield',KeyI:'super',KeyB:'super'};
const KEYS2P=[{KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'down',KeyF:'attack',KeyG:'special',KeyH:'shield',KeyT:'super',KeyR:'jump',Space:'jump'},
              {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyK:'attack',KeyL:'special',Semicolon:'shield',KeyO:'super',KeyP:'jump',Numpad1:'attack',Numpad2:'special',Numpad3:'shield',Numpad5:'super',Numpad0:'jump'}];
const GLOBAL={Escape:'pause',Enter:'start',KeyM:'mute',Slash:'help'};
const twoKeys=()=>G.mode==='versus'&&(G.phase==='select'||G.phase==='fight'||G.phase==='ready'||G.phase==='ko'||G.phase==='result');
function keyMap(code){
  if(GLOBAL[code])return[0,GLOBAL[code]];
  if(twoKeys()){for(let p=0;p<2;p++)if(KEYS2P[p][code])return[p,KEYS2P[p][code]];return null;}
  if(code==='KeyH')return[0,'help'];
  if(code==='KeyP')return[0,'pause'];
  return KEYS1P[code]?[0,KEYS1P[code]]:null;
}
const keysDown=new Set(),touchKeys=new Map();
const HELD=[{...NOINP},{...NOINP}],PADHELD=[{...NOINP},{...NOINP}];
let sawKeys=false;
function recompute(){
  const t=new Set(touchKeys.values());
  for(let p=0;p<2;p++)for(const b of BTN)HELD[p][b]=p===0&&(t.has(b)||!!STK[b]);
  for(const code of keysDown){const m=keyMap(code);if(m&&HELD[m[0]][m[1]]!==undefined)HELD[m[0]][m[1]]=true;}
  document.querySelectorAll('#pad .pb').forEach(b=>b.classList.toggle('on',t.has(b.dataset.k)));
}
function syncInputs(){for(const f of G.f)if(f.human)for(const b of BTN)f.inp[b]=HELD[f.pl][b]||PADHELD[f.pl][b];}
addEventListener('keydown',e=>{
  const m=keyMap(e.code);if(!m)return;e.preventDefault();
  if(e.repeat)return;sawKeys=true;
  if(m[1]==='mute'){toggleMute();return;}
  if(m[1]==='help'&&twoKeys())return;
  keysDown.add(e.code);recompute();onPress(m[0],m[1]);
});
addEventListener('keyup',e=>{if(keysDown.delete(e.code))recompute();});
addEventListener('blur',()=>{keysDown.clear();touchKeys.clear();recompute();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.phase==='fight'&&!G.paused)setPause(true);});
// game controllers
const padPrev=[{},{}];
function padCount(){if(!navigator.getGamepads)return 0;return[...navigator.getGamepads()].filter(Boolean).length;}
function pollPads(){
  if(!navigator.getGamepads)return;
  let gps=[];try{gps=[...navigator.getGamepads()].filter(Boolean);}catch(e){return;}
  for(let i=0;i<2;i++){
    const gp=gps[i],s={};
    if(gp){const b=k=>!!(gp.buttons[k]&&gp.buttons[k].pressed),ax=gp.axes[0]||0,ay=gp.axes[1]||0;
      s.left=ax<-.5||b(14);s.right=ax>.5||b(15);s.up=ay<-.6||b(12);s.down=ay>.6||b(13);
      s.attack=b(0);s.special=b(1);s.jump=b(2);s.super=b(3);s.shield=b(4)||b(5)||b(6)||b(7);s.pause=b(9);}
    const pl=twoKeys()?i:0;
    for(const k of [...BTN,'pause']){if(s[k]&&!padPrev[i][k])onPress(pl,k);}
    padPrev[i]=s;
  }
  // 1 player: either controller drives P1. 2 players: controller 1 = P1, controller 2 = P2.
  const two=twoKeys();
  for(const k of BTN){PADHELD[0][k]=!!(padPrev[0][k]||(!two&&padPrev[1][k]));PADHELD[1][k]=two&&!!padPrev[1][k];}
}
const pad=document.getElementById('pad');
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}};
const keyAt=(x,y)=>{const el=document.elementFromPoint(x,y);const b=el&&el.closest&&el.closest('#pad [data-k]');return b?b.dataset.k:null;};
pad.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-k]');if(!b)return;e.preventDefault();TOUCH=true;buzz();touchKeys.set(e.pointerId,b.dataset.k);recompute();onPress(0,b.dataset.k);});
pad.addEventListener('pointermove',e=>{if(!touchKeys.has(e.pointerId))return;const k=keyAt(e.clientX,e.clientY);if(k&&k!==touchKeys.get(e.pointerId)){touchKeys.set(e.pointerId,k);recompute();onPress(0,k);}});
const endPtr=e=>{if(touchKeys.delete(e.pointerId))recompute();};
pad.addEventListener('pointerup',endPtr);pad.addEventListener('pointercancel',endPtr);pad.addEventListener('lostpointercapture',endPtr);
pad.addEventListener('contextmenu',e=>e.preventDefault());
// Floating stick: put a thumb down anywhere on the left side and drag.
const STK={left:false,right:false,up:false,down:false};
const stickEl=document.getElementById('stick');let stickId=null,sx=0,sy=0;
function stickSet(dx,dy){
  const R=stickEl.querySelector('.base').offsetWidth*.42||50,m=Math.hypot(dx,dy);
  if(m>R*1.5){sx+=dx*(1-R*1.5/m);sy+=dy*(1-R*1.5/m);dx*=R*1.5/m;dy*=R*1.5/m;stickEl.style.setProperty('--sx',sx+'px');stickEl.style.setProperty('--sy',sy+'px');}
  const cl=Math.min(1,R/Math.max(1,Math.hypot(dx,dy)));stickEl.style.setProperty('--kx',dx*cl+'px');stickEl.style.setProperty('--ky',dy*cl+'px');
  const nx=dx/R,ny=dy/R,n={left:nx<-.35,right:nx>.35,up:ny<-.55,down:ny>.55};
  for(const k in n){if(n[k]&&!STK[k]){STK[k]=true;recompute();onPress(0,k==='up'?'stickup':k);}else if(!n[k]&&STK[k]){STK[k]=false;recompute();}}
}
function stickEnd(){stickId=null;stickEl.classList.remove('on');for(const k in STK)STK[k]=false;recompute();['--sx','--sy','--kx','--ky'].forEach(p=>stickEl.style.removeProperty(p));}
stickEl.addEventListener('pointerdown',e=>{if(stickId!==null)return;e.preventDefault();TOUCH=true;audio();stickId=e.pointerId;try{stickEl.setPointerCapture(e.pointerId)}catch(_){}const r=stickEl.getBoundingClientRect();sx=e.clientX-r.left;sy=e.clientY-r.top;stickEl.style.setProperty('--sx',sx+'px');stickEl.style.setProperty('--sy',sy+'px');stickEl.classList.add('on');stickSet(0,0);});
stickEl.addEventListener('pointermove',e=>{if(e.pointerId!==stickId)return;const r=stickEl.getBoundingClientRect();stickSet(e.clientX-r.left-sx,e.clientY-r.top-sy);});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>stickEl.addEventListener(t,e=>{if(e.pointerId===stickId)stickEnd();}));
document.getElementById('tpause').addEventListener('click',()=>{audio();if(G.phase==='fight'||G.phase==='ready')onPress(0,'pause');else if(G.howto!=null)G.howto=null;});
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch')TOUCH=true;
  audio();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*960,y=(e.clientY-r.top)/r.height*540;
  if(G.howto!=null){onPress(0,x<300?'left':'tap');return;}
  if(G.paused){for(let i=0;i<PMENU().length;i++)if(Math.abs(y-(260+i*40))<18){pauseSelect(i);return;}return;}
  if(G.phase==='title'){for(let i=0;i<4;i++)if(Math.abs(y-(286+i*50))<22&&x<480){G.menu=i;chooseMenu(i);return;}return;}
  if(G.phase==='select'){
    for(let i=0;i<ROSTER.length;i++){const c=cardRect(i);if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h){if(G.sel[0]===i){G.lock[0]=true;G.lock[1]=true;beginMode();}else{G.sel[0]=i;SFX.blip();}return;}}
    if(y>455){onPress(0,'shield');return;}
    return;
  }
  if(G.phase==='result'&&G.mode!=='arcade'){for(let i=0;i<3;i++)if(Math.abs(y-(350+i*34))<16&&G.t>=40){resultSelect(i);return;}return;}
  if(G.phase!=='fight'&&G.phase!=='ready'&&G.phase!=='ko')onPress(0,'start');
});
const muteBtn=document.getElementById('mute'),pauseBtn=document.getElementById('pauseBtn'),helpBtn=document.getElementById('helpBtn');
function toggleMute(){muted=!muted;try{localStorage.setItem('scarfkid-muted',muted?'1':'0')}catch(e){}muteBtn.textContent=muted?'Sound off':'Sound on';audio();}
muteBtn.textContent=muted?'Sound off':'Sound on';
muteBtn.addEventListener('click',toggleMute);
pauseBtn.addEventListener('click',()=>{if(G.phase==='fight'||G.phase==='ready')onPress(0,'pause');});
helpBtn.addEventListener('click',()=>{onPress(0,'help');helpBtn.blur();});

/* ---------------- loop ---------------- */
if(document.fonts&&document.fonts.load)document.fonts.load('700 16px Silkscreen').catch(()=>{});
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(100,now-last);last=now;pollPads();while(acc>=1000/60){syncInputs();step();acc-=1000/60;}render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.__G=G;window.__T={startMove,landHit,MOVES,CHARS,step,onPress,cam,HELD,syncInputs,render,aiFor};
})();

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Scarf Kid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one arcade screen, centered. Touch pads sit under it in portrait and float over its corners in landscape. */
:root{
  --void:#0d0a1a; --rim:#2a2046; --ink:#efe8ff; --muted:#9d93c2; --hair:#ff9ad0; --scarf:#e0342c; --suit:#3346e0; --energy:#5bc0ff;
  --pixel:'Silkscreen', ui-monospace, 'Courier New', monospace;
  --reserve:64px; --b:clamp(44px,13vw,60px);
  color-scheme:dark;
}
html,body{height:100%;touch-action:manipulation}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--pixel);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{box-sizing:border-box;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#screen{position:relative;width:min(100%, calc((100vh - var(--reserve) - 20px) * 16 / 9));width:min(100%, calc((100dvh - var(--reserve) - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 16 / 9));max-width:100%}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000;box-shadow:0 0 0 2px #000,0 0 0 5px var(--rim),0 18px 50px rgba(0,0,0,.55);cursor:pointer;touch-action:none}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;font-size:11px;color:var(--muted);letter-spacing:.04em;max-width:100%}
.keys{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center}
kbd{font-family:var(--pixel);color:var(--ink);background:#1d1633;border:1px solid var(--rim);border-bottom-width:3px;padding:0 5px;border-radius:2px}
.tbtn{font:inherit;color:var(--ink);background:#1d1633;border:2px solid var(--rim);padding:3px 10px;cursor:pointer}
.tbtn.hi{border-color:var(--hair);color:#fff}
.tbtn:focus-visible,.pb:focus-visible{outline:2px solid var(--hair);outline-offset:2px}
.credit{color:var(--hair)}
#pad{display:none;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#stick{position:absolute;left:0;top:0;bottom:0;width:48%;touch-action:none}
#stick .base{position:absolute;left:var(--sx,30%);top:var(--sy,55%);width:var(--sr);height:var(--sr);margin:calc(var(--sr) / -2) 0 0 calc(var(--sr) / -2);border-radius:50%;border:3px solid rgba(255,255,255,.25);background:rgba(20,14,40,.45);opacity:.6}
#stick.on .base{opacity:1}
#stick .knob{position:absolute;left:50%;top:50%;width:46%;height:46%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffffff,#bfb4e6);box-shadow:0 3px 0 rgba(0,0,0,.45);transform:translate(-50%,-50%) translate(var(--kx,0px),var(--ky,0px))}
#stick .lbl{font-family:Rajdhani,'Segoe UI',system-ui,sans-serif;position:absolute;left:var(--sx,30%);top:calc(var(--sy,55%) + var(--sr) / 2 + 6px);transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.12em;pointer-events:none;white-space:nowrap}
#stick.on .lbl{display:none}
.btns{position:absolute;right:max(6px,env(safe-area-inset-right,0px));bottom:6px;width:calc(var(--b) * 3.7);height:calc(var(--b) * 3.3);touch-action:none}
.pb{position:absolute;font-family:Rajdhani,'Segoe UI',system-ui,sans-serif;font-weight:700;font-size:12px;color:#fff;border:3px solid #000;border-radius:50%;width:var(--b);height:var(--b);box-shadow:0 4px 0 #000,inset 0 -5px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;touch-action:none;-webkit-user-select:none;user-select:none;line-height:1.05}
.pb small{display:block;font-size:8px;opacity:.9;margin-top:2px;max-width:92%;overflow:hidden;white-space:nowrap}
.pb.on{transform:translateY(3px);box-shadow:0 1px 0 #000,inset 0 -2px 0 rgba(0,0,0,.25);filter:brightness(1.35)}
.pb.atk{width:calc(var(--b) * 1.42);height:calc(var(--b) * 1.42);right:calc(var(--b) * .1);bottom:calc(var(--b) * .15);background:#d9468f;font-size:15px}
.pb.spc{right:calc(var(--b) * 1.72);bottom:calc(var(--b) * .05);background:#3346e0;font-size:10px}
.pb.jmp{right:calc(var(--b) * .3);bottom:calc(var(--b) * 1.78);background:#6b54b0}
.pb.shd{right:calc(var(--b) * 1.58);bottom:calc(var(--b) * 1.4);background:#1b8f80;font-size:11px}
.pb.sup{right:calc(var(--b) * 2.75);bottom:calc(var(--b) * 2.15);width:calc(var(--b) * .85);height:calc(var(--b) * .85);background:#4a1820;opacity:.4;font-size:10px}
.pb.sup.ready{opacity:1;background:#e0342c;animation:pulse .5s steps(2) infinite}
@keyframes pulse{50%{filter:brightness(1.6)}}
@media (prefers-reduced-motion: reduce){.pb.sup.ready{animation:none}}
#tpause{position:fixed;z-index:5;right:max(8px,env(safe-area-inset-right,0px));top:max(8px,env(safe-area-inset-top,0px));width:42px;height:36px;border-radius:8px;border:2px solid var(--rim);background:rgba(20,14,40,.75);color:#fff;font:700 14px Rajdhani,system-ui,sans-serif;touch-action:manipulation;display:none}
body.playing #tpause{display:block}
#rot{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-family:Rajdhani,'Segoe UI',system-ui,sans-serif;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;white-space:nowrap;pointer-events:none}
/* Phones: the game sits on top and a gamepad fills the rest of the screen. Turned sideways, the game fills the screen and the pad floats over it. */
@media (hover:none) and (pointer:coarse){
  :root{--b:calc(clamp(44px,12.5vw,58px) * var(--bs,1));--sr:calc(clamp(96px,27vw,124px) * var(--bs,1))}
  #app{justify-content:flex-start;gap:0;padding:max(8px,env(safe-area-inset-top,0px)) 8px 0 8px}
  #screen{width:100%}
  .bar{display:none}
  #pad{display:block;position:relative;flex:1;width:100%;min-height:170px;margin-bottom:env(safe-area-inset-bottom,0px)}
  .btns{bottom:clamp(10px,calc(50% - var(--b) * 1.65),240px)}
  #stick{--sy:50%}
}
@media (hover:none) and (pointer:coarse) and (orientation:portrait){
  #stick{width:40%;--sx:50%}
  :root{--sr:calc(min(26vh - 44px, 36vw) * var(--bs,1))}
  .btns{top:24px;right:8px;bottom:8px;height:auto;width:min(calc(58% * var(--bs,1)),72%);display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1.2fr;gap:8px}
  .btns .pb{position:static;width:auto;height:auto;border-radius:18px;font-size:15px}
  .btns .pb.sup{grid-area:1/1;font-size:12px}.btns .pb.shd{grid-area:1/2}.btns .pb.jmp{grid-area:1/3}.btns .pb.spc{grid-area:2/1;font-size:13px}.btns .pb.atk{grid-area:2/2/3/4;font-size:22px}
  .btns .pb small{font-size:9px}
}
@media (hover:none) and (pointer:coarse) and (orientation:landscape){
  :root{--b:calc(clamp(38px,10.5vh,52px) * var(--bs,1));--sr:calc(clamp(84px,24vh,112px) * var(--bs,1))}
  #app{padding:0;justify-content:center}
  #screen{width:min(100vw,calc(100dvh * 16 / 9))}
  canvas{box-shadow:none}
  #pad{position:fixed;inset:0;min-height:0;margin:0;pointer-events:none}
  body:not(.playing) #pad{display:none}
  #stick,.btns,#tpause{pointer-events:auto}
  #stick{top:18%}
  .btns{bottom:6px}
  .pb{opacity:.6}.pb.sup{opacity:.3}.pb.sup.ready{opacity:.9}
  #stick .base{opacity:.3}#stick.on .base{opacity:.75}
  #rot{display:none}
}
</style>

<div id="app">
  <div id="screen"><canvas id="cv" role="img" aria-label="Scarf Kid game screen"></canvas></div>
  <div class="bar">
    <span class="keys"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span><span><kbd>Space</kbd> jump</span><span><kbd>J</kbd> attack</span><span><kbd>K</kbd> special</span><span><kbd>L</kbd> shield</span></span>
    <button class="tbtn hi" id="helpBtn" type="button">How to play (H)</button>
    <button class="tbtn" id="mute" type="button">Sound on</button>
    <button class="tbtn" id="pauseBtn" type="button">Pause</button>
    <span class="credit">Hero sprite by Eames</span>
  </div>
  <div id="pad" aria-label="Touch controls">
    <div id="stick"><div class="base"><div class="knob"></div></div><span class="lbl">DRAG TO MOVE</span></div>
    <span id="rot">TURN SIDEWAYS FOR A BIGGER SCREEN</span>
    <button type="button" id="tpause" aria-label="Pause">II</button>
    <div class="btns">
      <button type="button" class="pb sup" data-k="super">SUPER</button>
      <button type="button" class="pb shd" data-k="shield">SHIELD</button>
      <button type="button" class="pb jmp" data-k="jump">JUMP</button>
      <button type="button" class="pb spc" data-k="special">SPECIAL<small id="spcName">SHOT</small></button>
      <button type="button" class="pb atk" data-k="attack">ATTACK</button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const W=480,H=270,SC=2,GRAV=.5,SPARKWIN=12,AIRK=.8;   // AIRK: how fast you can drift sideways in the air, as a share of each fighter's air speed
// Stage shapes. A soft platform with `move` drifts back and forth (ax/ay = distance, per = frames per loop).
const LAYOUTS=[
 {main:{x0:70,x1:410,y:196,bot:222},soft:[{x0:108,x1:204,y:142},{x0:276,x1:372,y:142},{x0:194,x1:286,y:90}]},
 {main:{x0:64,x1:416,y:196,bot:222},soft:[{x0:186,x1:294,y:136,move:{ax:110,ay:0,per:540}}],hazard:'train'},
 {main:{x0:82,x1:398,y:200,bot:226},soft:[{x0:108,x1:196,y:150},{x0:284,x1:372,y:150}],hazard:'fire'},
 {main:{x0:96,x1:384,y:196,bot:222},soft:[{x0:34,x1:122,y:150,move:{ax:0,ay:26,per:360}},{x0:358,x1:446,y:150,move:{ax:0,ay:26,per:360,ph:Math.PI}},{x0:196,x1:284,y:104,move:{ax:0,ay:16,per:300,ph:1.5}}]},
 {main:{x0:52,x1:428,y:196,bot:222},soft:[]},
 {main:{x0:120,x1:360,y:202,bot:226},soft:[{x0:52,x1:136,y:164},{x0:344,x1:428,y:164},{x0:136,x1:230,y:120},{x0:250,x1:344,y:120},{x0:196,x1:284,y:76,move:{ax:70,ay:0,per:420}}]},
];
let STAGE=LAYOUTS[0];
function useLayout(i){const L=LAYOUTS[i%LAYOUTS.length];STAGE={main:{...L.main},soft:L.soft.map(P=>({...P,bx0:P.x0,bx1:P.x1,by:P.y,dx:0,dy:0})),hazard:L.hazard};}
function updStage(){G.stageT++;for(const P of STAGE.soft){if(!P.move){P.dx=P.dy=0;continue;}const a=2*Math.PI*G.stageT/P.move.per+(P.move.ph||0),nx=P.bx0+P.move.ax*Math.sin(a),ny=P.by+P.move.ay*Math.sin(a);P.dx=nx-P.x0;P.dy=ny-P.y;P.x0=nx;P.x1=P.bx1+(nx-P.bx0);P.y=ny;}}
const BL={l:-110,r:W+110,t:-160,b:H+90};
const PIXEL=true;   // build flag: the pixel version is this same file with PIXEL=true
const DPR=2;   // canvas is drawn at 1920x1080 for a sharp look
const cv=document.getElementById('cv');cv.width=W*SC*DPR;cv.height=H*SC*DPR;
const MAIN=cv.getContext('2d');MAIN.imageSmoothingEnabled=!PIXEL;MAIN.imageSmoothingQuality='high';
// VH = height of the screen in layout units (width is always 960). On an upright phone the fight view grows
// taller so the game fills about 3/4 of the screen; menus stay 960x540. UIY centers 960x540 overlays in it.
let VH=540,UIY=0;const COARSE=matchMedia('(hover: none) and (pointer: coarse)');
function fitCanvas(){
  let vh=540;
  if((TOUCH||COARSE.matches)&&innerHeight>innerWidth*1.15){const w=cv.clientWidth||innerWidth,t=Math.round(960*(innerHeight*.74-8)/w);if(t>=1150)vh=Math.min(t,1800);}
  if(vh!==VH){VH=vh;cv.height=Math.round(VH*DPR);cv.style.aspectRatio=`960/${VH}`;MAIN.imageSmoothingEnabled=!PIXEL;MAIN.imageSmoothingQuality='high';}
  UIY=(VH-540)/2;
}
const PM=()=>VH>540;   // upright phone: screens use their tall phone layouts
let UIK=1,UIX=0,UIY2=0;   // optional zoom for simple centered screens on phones
function uiT(){ST(UIK,0,0,UIK,UIX,UIY2);}
function zoomUI(k){UIK=k;UIX=480*(1-k);UIY2=(VH-540*k)/2;uiT();}
function resetUI(){UIK=1;UIX=0;UIY2=0;ST(1,0,0,1,0,0);}
function skyT(pz,ox,oy){pz=Math.max(pz,VH/(SC*(H+80))*1.02);ST(SC*pz,0,0,SC*pz,SC*(W/2-(W/2+(cam.x-W/2)*.2)*pz)+ox,VH/2-SC*(H/2+(cam.y-H/2)*.2)*pz+oy);}
function worldT(z,ox,oy){ST(SC*z,0,0,SC*z,SC*(W/2-cam.x*z)+ox*SC,VH/2-SC*cam.y*z+oy*SC);}
let ctx=MAIN,K=DPR;
const ST=(a,b,c,d,e,f)=>ctx.setTransform(a*K,b*K,c*K,d*K,e*K,f*K);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let TOUCH=matchMedia('(hover: none) and (pointer: coarse)').matches;
const R=Math.random,rr=(a,b)=>a+R()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------------- audio ---------------- */
let AC=null,NB=null,muted=false;
try{muted=localStorage.getItem('scarfkid-muted')==='1'}catch(e){}
function audio(){if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(A){try{AC=new A()}catch(e){}}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}
function tone(f0,f1,dur,type,vol,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);}
function noise(dur,vol,freq,delay){if(!AC||muted)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5|0,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=.8;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur+.02);}
const SFX={
  whiff:()=>noise(.07,.07,2600),
  hit:()=>{noise(.09,.28,1000);tone(190,70,.1,'square',.1)},
  heavy:()=>{noise(.16,.38,520);tone(130,40,.18,'square',.14)},
  launch:()=>{noise(.35,.4,380);tone(110,30,.4,'sawtooth',.15)},
  block:()=>{noise(.05,.18,3800);tone(1000,700,.05,'triangle',.07)},
  blast:()=>tone(260,880,.22,'sawtooth',.07),
  spark:()=>{noise(.4,.5,280);tone(90,30,.45,'sawtooth',.22);tone(1800,240,.28,'square',.07)},
  super:()=>{tone(180,1400,.55,'sawtooth',.09);noise(.5,.15,1600)},
  ko:()=>{tone(420,40,.9,'square',.14);noise(.7,.32,380)},
  blip:()=>tone(660,660,.06,'square',.07),
  go:()=>{tone(523,523,.09,'square',.09);tone(784,784,.16,'square',.09,.1)},
  count:()=>tone(440,440,.1,'square',.08),
  jump:()=>tone(240,480,.08,'triangle',.05),
  djump:()=>tone(360,720,.09,'triangle',.05),
  tele:()=>tone(1400,180,.22,'sine',.1),
  win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,f,.14,'square',.08,i*.12)),
  shield:()=>tone(700,520,.05,'triangle',.05),
  roll:()=>noise(.12,.08,1600),
  grab:()=>tone(300,200,.06,'square',.07),
  throw:()=>{noise(.12,.2,700);tone(200,90,.12,'square',.08)},
  tech:()=>tone(900,1500,.08,'square',.06),
  ledge:()=>tone(500,760,.05,'triangle',.06),
  brk:()=>{tone(800,100,.5,'sawtooth',.12);noise(.4,.3,2000)},
  counter:()=>{tone(1200,300,.15,'square',.1);noise(.1,.2,3000)},
  charge:()=>tone(300+R()*200,300,.03,'triangle',.03),
  dash:()=>noise(.06,.06,1200),
  check:()=>{tone(784,784,.06,'square',.07);tone(1175,1175,.1,'square',.07,.07)},
};

/* ---------------- fighters: character cards ----------------
   HOW TO ADD A FIGHTER: copy a card in CARDS, give it a new id, pick a style, set its colors,
   draw a 12x12 face in `head` (each letter is a color from `hpal`, '.' is empty), then it shows up
   in the roster automatically. Anything a card leaves out comes from its style.
   Styles: brawler (Scarf Kid) · blob (Gloop) · speedster (Hollow) · heavy (Ironjaw) · showoff (Zenith).
   stats: run/dash/air px per frame (stage is ~312px wide), jump = takeoff speed, rise = up-special speed,
   weight = how hard to launch, dm = damage multiplier. power = stars (only used when POWER SCALING is CANON).
   moves: overrides of the shared MOVES table. Extra move flags: multi = hits again every N frames
   (last = the final hit), armor = can't be knocked out of it, vel = [forward, down] speed while active,
   blink = teleports forward, wave/landWave = ground shockwaves, quake = screen shake, fx = drawn effect,
   gulp = swallow, domain = freezes the target. */
const STYLES={
 brawler:{stats:{s:1,tw:9,lw:4,run:3.4,dash:3.9,air:2.8,airAcc:.34,jump:9.6,grav:1,fall:6.6,weight:98,dm:1,jumps:1,rise:10.4,sdash:6.6},
   shot:{v:4.6,r:5,cd:40,life:110},
   names:{jab:'ONE-TWO-KICK',side:'SMASH PUNCH',upa:'JUMPING UPPERCUT',downa:'LOW SWEEP',nair:'SPIN KICK',fair:'FLYING KICK',uair:'PUNCH FLURRY',dair:'STOMP'},
   moves:{
  upa:{st:6,ac:9,vel:[.8,-4.2],dmg:11,kbg:7},
  uair:{multi:3,ac:7,dmg:3,bkb:2.4,kbg:0,ang:90,last:{dmg:5,bkb:3,kbg:5,ang:85}},
   }},
 blob:{stats:{s:1.12,tw:14,lw:5,run:2.6,dash:3.1,air:2.4,airAcc:.3,jump:8.6,grav:.8,fall:5.2,weight:126,dm:1.1,jumps:2,rise:9.4,sdash:5.4},
   shot:{v:2.8,r:8,cd:60,life:130},
   names:{jab:'BLOB JABS',side:'BIG SLAP',upa:'GEYSER',downa:'PUDDLE SPLASH',nair:'BLOB SPIN',fair:'SPLAT',uair:'BLOB HEADBUTT',dair:'BELLY FLOP'},
   moves:{
  jab:{hb:[6,-38,22,14]},jab2:{hb:[6,-38,24,14]},
  side:{st:15,ac:6,rc:26,dmg:15,hb:[4,-42,42,20],kbg:5.6,lunge:1,p1:'blast'},
  upa:{st:10,ac:12,rc:22,dmg:3,hb:[-6,-96,28,96],bkb:3,kbg:0,ang:90,multi:4,last:{dmg:6,bkb:4.5,kbg:7,ang:88},charge:0,fx:'column',fxCol:'#6ee06a',p1:'pillar'},
  downa:{st:9,dmg:10,hb:[-34,-10,68,10],ang:75,bkb:4,kbg:3.6,p1:'slam'},
  nair:{hb:[-20,-48,44,44],dmg:8},
  fair:{hb:[4,-40,30,18],dmg:11,p1:'blast'},
  dair:{st:8,ac:20,rc:16,vel:[.6,7],dmg:12,hb:[-16,-16,36,18],ang:60,bkb:4,kbg:4,ll:16,landWave:{v:3,r:6,dmg:7,life:30},p0:'jump',p1:'flop'},
  super:{dash:2,gulp:1,hb:[0,-48,32,44],dmg:0},
   }},
 speedster:{stats:{s:1.08,tw:7,lw:3,run:4.3,dash:4.8,air:3.2,airAcc:.38,jump:10.2,grav:1.1,fall:7.4,weight:84,dm:.92,jumps:1,rise:10.8,sdash:7.6,tele:true},
   shot:null,
   names:{jab:'QUICK JABS',side:'PHASE CUT',upa:'UPDRAFT SLASH',downa:'SHADOW SWEEP',nair:'SPIN SLASH',fair:'TRIPLE CUT',uair:'SKY KICK',dair:'DIVE KICK'},

/* ---------------- AI ---------------- */
function tap(f,b){f.latch[b]=true;}
function aiThink(me,op){
  const A=me.ai,P=A.P,h=me.inp;for(const k of BTN)h[k]=false;
  if(me.state==='dead'||G.phase!=='fight')return;
  const M=STAGE.main,mid=(M.x0+M.x1)/2,dx=op.x-me.x,dist=Math.abs(dx),dy=op.y-me.y;
  const toward=dx>0?'right':'left',away=dx>0?'left':'right',home=me.x<mid?'right':'left';
  const fdir=Math.sign(dx)||1;
  if(me.state==='revive'){if(me.t>30&&R()<.06)tap(me,'down');return;}
  if(me.state==='ledge'){if(me.t>8&&R()<.08){const r=R();if(r<.35)press(me,'jump');else if(r<.6)press(me,'attack');else if(r<.8)press(me,'shield');else tap(me,home);}return;}
  if(me.state==='holding'){const r=R();if(r<.35)h[toward]=true;else if(r<.6)h.up=true;else if(r<.8)h.down=true;else h[away]=true;return;}
  if(me.state==='dizzy'){if(R()<.3)tap(me,'left');return;}
  // shield punish: grab or up smash an attacker that whiffed into our shield
  if(me.state==='shield'||me.state==='shieldstun'){const om=op.move;if(op.state==='attack'&&om&&op.t>om.st+om.ac&&dist<34&&R()<P.acc){h.shield=true;press(me,'attack');A.hold=0;return;}}
  if(A.hold>0){A.hold--;Object.assign(h,A.held);return;}
  const hold=(o,n)=>{A.held=o;A.hold=n;Object.assign(h,o);};
  // recovery
  const off=!me.onGround&&(me.x<M.x0-2||me.x>M.x1+2||me.y>M.y+2);
  if(off&&me.state!=='hit'){
    if(A.willRecover==null)A.willRecover=R()<P.recover;
    if(A.willRecover){
      h[home]=true;
      const edgeX=me.x<mid?M.x0:M.x1,hd=Math.abs(me.x-edgeX);
      if(me.state==='air'&&me.vy>-1.5){
        if(me.y>M.y-30&&me.jumps>0)press(me,'jump');
        else if(!me.sideUsed&&hd>90&&me.y<M.y+40&&me.jumps===0)press(me,'special');
        else if(!me.risen&&me.y>M.y+14&&me.jumps===0){h.up=true;press(me,'special');}
      }
      return;
    }
  }
  if(me.onGround)A.willRecover=null;
  // combo / charge follow-through
  if(me.state==='attack'){
    if(me.move.charge&&me.chargeT<A.chargeWant)h[me.move.chargeBtn||'attack']=true;
    if(me.connected&&A.combo.length&&G.frame-me.hitFrame>=A.combo[0].d){const n=A.combo.shift();Object.assign(h,n.h||{});press(me,n.b);}
    return;
  }
  A.combo=[];
  // react to threats
  const om=op.move,opAtk=op.state==='attack'&&om&&om.hb&&op.t<om.st+om.ac&&dist<(om.dash||om.slide?110:62)&&Math.abs(dy)<60;
  const projIn=G.projs.some(p=>p.owner===op&&Math.sign(me.x-p.x)===Math.sign(p.vx)&&Math.abs(p.x-me.x)<100&&Math.abs(p.y-(me.y-24))<30);
  if((opAtk||projIn)&&A.react==null){const r=R();A.react=r<P.shield*.7?'shield':r<P.shield?(R()<.5?'jump':'counter'):'none';A.reactAt=G.frame+P.react;}
  else if(!opAtk&&!projIn&&A.react!=null&&G.frame>A.reactAt+6)A.react=null;
  if(A.react&&A.react!=='none'&&A.react!=='done'&&G.frame>=A.reactAt&&me.onGround&&(me.state==='idle'||me.state==='run'||me.state==='crouch')){
    if(A.react==='shield'){hold({shield:true},10+R()*12|0);}
    else if(A.react==='jump'){hold({jump:true,[away]:true},6);press(me,'jump');}
    else{h.down=true;press(me,'special');}
    A.react='done';return;
  }
  if(!['idle','run','crouch','air','shield'].includes(me.state))return;
  const opGone=op.state==='dead'||op.state==='revive';
  const opOn=op.x>M.x0-6&&op.x<M.x1+6;
  // in the air: drift toward and swing
  if(!me.onGround){
    if(!opGone&&opOn&&dist>10)h[toward]=true;
    if(me.x<M.x0+12)h.right=true,h.left=false;else if(me.x>M.x1-12)h.left=true,h.right=false;
    if(!opGone&&dist<34&&Math.abs(dy+12)<44&&R()<P.acc*.35){
      if(dy<-26){h.up=true;h.left=h.right=false;}else if(dy>22){h.down=true;h.left=h.right=false;}
      else{h.left=h.right=false;h[toward]=true;}
      press(me,'attack');
    }
    if(me.vy>0&&dy>40&&R()<.08)tap(me,'down');
    return;
  }
  if(STAGE.hazard==='train'&&G.haz.state==='go'&&!me.onSoft&&me.x-(G.haz.x+150)<110&&me.x>G.haz.x-10&&R()<.6){hold({jump:true},12);press(me,'jump');return;}
  if(STAGE.hazard==='fire'&&G.haz.state==='warn'){for(const z of G.haz.spots)if(Math.abs(z-me.x)<22){h[me.x<z?'left':'right']=true;return;}}
  if(G.items.length){
    if(me.item){if(Math.abs(dy)<40&&dist<170&&R()<.08){if(me.face!==fdir)h[toward]=true;press(me,'attack');return;}}
    else{const it=G.items.find(i=>i.state==='ground'&&i.onGround&&Math.abs(i.x-me.x)<150&&Math.abs(i.y-me.y)<30);
      if(it&&(it.type!=='heal'||me.pct>40)){if(it.type==='bomb'&&Math.abs(it.x-me.x)<14){press(me,'attack');return;}if(Math.abs(it.x-me.x)>8&&R()<.7){h[it.x>me.x?'right':'left']=true;return;}}}
  }
  const edgeDanger=d=>!me.onSoft&&((d==='left'&&me.x<M.x0+22)||(d==='right'&&me.x>M.x1-22));
  if(A.planT>0){A.planT--;
    if(A.plan==='approach'){if(dist<26||edgeDanger(toward)||!opOn)A.planT=0;else h[toward]=true;}
    else if(A.plan==='retreat'){if(edgeDanger(away))A.planT=0;else h[away]=true;}
    else if(A.plan==='dash'){h[toward]=true;if(dist<56&&me.runT>10){press(me,'attack');A.planT=0;}if(edgeDanger(toward))A.planT=0;}
    else if(A.plan==='home'){if(Math.abs(me.x-mid)<30)A.planT=0;else h[me.x<mid?'right':'left']=true;}
    return;
  }

  const set=(p,t)=>{A.plan=p;A.planT=Math.round(t);};
  if(opGone){set('home',30);return;}
  if(!opOn){if(Math.abs(me.x-mid)>90)set('home',20);return;}
  if(op.y<me.y-40&&dist<60&&R()<.5){hold({jump:true},8);press(me,'jump');return;}
  if(op.y>me.y+30&&me.onSoft&&R()<.5){tap(me,'down');return;}
  if(me.meter>=100&&dist<110&&Math.abs(dy)<24&&R()<.6){if(me.face!==fdir){h[toward]=true;return;}press(me,'super');return;}
  if(dist>110){
    if(me.projCD<=0&&R()<P.proj&&Math.abs(dy)<30&&!me.c.tele){if(me.face!==fdir){h[toward]=true;A.cool=1;return;}A.chargeWant=R()<.35?Math.round(rr(15,55)):0;press(me,'special');return;}
    if(me.c.tele&&me.projCD<=0&&R()<.25&&op.onGround){press(me,'special');return;}
    if(R()<P.aggro+.25)set(R()<.3?'dash':'approach',20+R()*30);else set('home',10);
  }else if(dist>34){
    const r=R();
    if(r<P.aggro*.35){hold({jump:R()<.5,[toward]:true},10);press(me,'jump');}
    else if(r<P.aggro*.55)set('dash',30);
    else if(r<P.aggro*.65&&!me.c.tele){h[toward]=true;press(me,'special');}
    else if(r<P.aggro)set('approach',8+R()*14);

    else set('retreat',10+R()*10);

    const r=R();
    if(r<P.aggro){

      if(op.state==='shield'&&R()<.7){h.shield=true;press(me,'attack');}
      else if(dy<-24){h.up=true;press(me,'attack');}
      else if(op.pct>85&&R()<.6){h[toward]=true;press(me,'attack');}
      else if(R()<.25){h.down=true;press(me,'attack');}
      else if(R()<.7){

function aiTarget(f){const A=f.ai;if(!A.tgt||A.tgt.state==='dead'||G.frame>=A.tgtT){A.tgt=R()<.3&&G.p.state!=='dead'&&G.p!==f?G.p:other(f);A.tgtT=G.frame+90+(R()*120|0);}return A.tgt;}
function aiFor(lvl){return{P:LEVELS[lvl],cool:40,plan:null,planT:0,combo:[],react:null,reactAt:0,willRecover:null,hold:0,held:{},chargeWant:0};}
function setupFighters(ids){
  G.f=ids.map((id,i)=>mkFighter(id,i));G.p=G.f[0];G.e=G.f[1];

function startMatch(i){

}
function startBattle(){
  const r=G.rules;G.stage=r.stage>0?r.stage-1:(R()*STAGES.length)|0;
  const ids=[ROSTER[G.sel[0]]];if(r.humans===2)ids.push(ROSTER[G.sel[1]]);
  const pool=ROSTER.filter(id=>!ids.includes(id)).sort(()=>R()-.5);

  setupFighters(ids);
  if(r.humans===2)G.f[1].human=true;
  for(const f of G.f)if(!f.human)f.ai=aiFor(r.level);
  startFight();
}
function startTraining(){

function startFight(){
  useLayout(G.stage);const M=STAGE.main,n=G.f.length;
  G.rule=G.mode==='battle'?G.rules.rule:0;

  G.f.forEach((f,i)=>{const x=n===2?(i?M.x1-80:M.x0+80):M.x0+40+(M.x1-M.x0-80)*i/(n-1);
    Object.assign(f,{x,y:M.y,vx:0,vy:0,face:x<W/2?1:-1,onGround:true,onSoft:false,state:'idle',t:0,pct:0,shownPct:0,stocks:lives,meter:0,hidden:false,inv:0,buf:null,tail:null,jumps:f.c.jumps,shield:100,kos:0,falls:0,dmgDealt:0,dmgTaken:0,bestCombo:0,outAt:0,item:null,power:0,lastHitBy:null,held:null,plat:null});});
  G.projs=[];G.parts=[];G.bolts=[];G.texts=[];G.kofx=[];G.domain=0;G.combo=null;G.stop=0;G.slow=0;G.freeze=0;G.winner=null;G.fightT=0;
  G.items=[];G.itemT=420;G.haz={t:0};G.stageT=0;G.timer=G.rule===2?7200:0;G.timeOut=false;G.finish=null;
  G.phase='ready';G.t=0;updCam(true);
}
function afterKO(){
  G.phase='result';G.t=0;G.rmenu=0;
  const key=f=>G.rule===2?score(f):(f.stocks>0?1e9:f.outAt||0);
  G.places=[...G.f].sort((a,b)=>key(b)-key(a));
  if(G.winner)G.places=[G.winner,...G.places.filter(f=>f!==G.winner)];
  if(G.mode==='arcade')G.res=G.winner===G.p?'win':'lose';
  else G.res='battle';
  if(G.winner&&G.winner.human){SFX.win();G.won=true;}else G.won=false;
  if(G.winner)announce((G.winner.human&&G.mode==='battle'&&G.rules.humans===2?'Player '+(G.winner.pl+1):G.winner.c.name.toLowerCase())+' wins!');
}

function updCam(snap){
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity,n=0;
  if(G.freeze>0&&G.freezeBy){const f=G.freezeBy;x0=x1=f.x;y0=f.y-50;y1=f.y;n=1;}
  else for(const f of G.f){if(f.state==='dead'||f.hidden)continue;n++;const fx=clamp(f.x,BL.l+60,BL.r-60),fy=clamp(f.y,BL.t+60,BL.b-30);x0=Math.min(x0,fx);x1=Math.max(x1,fx);y0=Math.min(y0,fy-50);y1=Math.max(y1,fy);}
  if(!n){x0=STAGE.main.x0;x1=STAGE.main.x1;y0=110;y1=196;}
  const cx=(x0+x1)/2*.8+W/2*.2,cy=(y0+y1)/2*.8+150*.2;
  const span=Math.max((x1-x0)+170,((y1-y0)+120)*960/VH);
  const z=clamp(W/span,1,G.freeze>0?1.9:VH>540?2.3:1.6)+cam.kick;
  const hw=W/2/z,hh=VH/(2*SC*z),lo=hh-70,hi=H-hh+(VH>540?50:0);
  const tx=clamp(cx,hw-30,W-hw+30),ty=lo<=hi?clamp(cy,lo,hi):(lo+hi)/2;
  const k=snap?1:.1;cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;cam.z+=(z-cam.z)*(snap?1:.07);cam.kick*=.86;
}
function WS(x,y){return[SC*(W/2+(x-cam.x)*cam.z),VH/2+SC*(y-cam.y)*cam.z];}

function step(){
  G.frame++;G.t++;
  if(G.white>0)G.white--;if(G.neg>0)G.neg--;if(G.domain>0&&!G.paused&&G.howto==null)G.domain--;
  G.shake=G.shake>.3?G.shake*.86:0;
  for(const t of G.texts){t.life--;t.y+=t.vy*(t.screen?SC:1);}G.texts=G.texts.filter(t=>t.life>0);
  for(const b of G.bolts)b.life--;G.bolts=G.bolts.filter(b=>b.life>0);
  for(const k of G.kofx)k.t++;G.kofx=G.kofx.filter(k=>k.t<26);
  if(G.combo&&--G.combo.t<=0)G.combo=null;
  if(G.paused||G.howto!=null){G.t--;return;}
  if(G.finish)G.finish.t++;
  if(G.phase==='fight'&&G.timer>0&&G.freeze<=0&&--G.timer===0)timeUp();   // the match clock runs in real time, even through slow motion
  const ph=G.phase;
  if(ph==='title'||ph==='select'||ph==='ending'||ph==='rules'||ph==='settings')return;
  if(ph==='intro'){if(G.t>200)startFight();return;}
  if(ph==='result'){updParts();return;}
  if(G.freeze>0){G.freeze--;const f=G.freezeBy;updPose(f);if(G.freeze%2)G.parts.push({x:f.x+rr(-10,10),y:f.y-rr(0,40),vx:0,vy:-1.2,life:14,max:14,col:f.c.aura,size:2,grav:0});updParts();updCam();return;}
  if(G.stop>0){G.stop--;return;}
  if(G.slow>0){G.slow--;if(G.slow%3){updCam();return;}}
  const live=ph==='fight';
  if(live){G.fightT++;updStage();updHazard();updItems();for(const f of G.f)if(f.ai)aiThink(f,aiTarget(f));if(G.mode==='training')G.p.meter=Math.min(100,G.p.meter+.5);}
  for(const f of G.f){if(G.phase==='ko'&&f.state==='dead')continue;updFighter(f,other(f),live);}
  for(let a=0;a<G.f.length;a++)for(let b=a+1;b<G.f.length;b++)separate(G.f[a],G.f[b]);
  updProjs();updParts();
  for(const f of G.f)f.shownPct+=(f.pct-f.shownPct)*.3;
  updCam();
  if(ph==='ready'){if(G.t===20)announce('Ready...');if(G.t===20||G.t===50||G.t===80)SFX.count();if(G.t===110){SFX.go();announce('Go!');}if(G.t>=110){G.phase='fight';G.t=0;}}
  else if(ph==='ko'){if(G.t===70&&G.winner&&G.winner.state!=='dead'&&G.winner.onGround)G.winner.state='win';if(G.t>=160)afterKO();}
}

let lastPad='';
function syncPad(){
  const f=G.p,fighting=(G.phase==='fight'||G.phase==='ready'||G.phase==='ko')&&!G.paused&&G.howto==null;
  const k=(fighting&&f&&f.meter>=100?'s':'')+'|'+(fighting?'p':'')+'|'+(f?f.c.sp[0]:'');
  if(k===lastPad)return;lastPad=k;
  document.querySelector('.pb.sup').classList.toggle('ready',fighting&&f&&f.meter>=100);
  document.body.classList.toggle('playing',fighting);
  document.getElementById('spcName').textContent=f?f.c.sp[0]:'SHOT';
}

function render(){
  fitCanvas();ST(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,960,VH);
  const ph=G.phase;
  if(ph==='title')drawTitle();else if(ph==='rules')drawRules();else if(ph==='settings')drawSettings();else if(ph==='select')drawSelect();else if(ph==='intro'){drawIntro();resetUI();}else if(ph==='ending'){drawEnding();resetUI();}else drawArena();
  if(ph!=='title'&&ph!=='select'&&ph!=='intro'&&ph!=='ending'&&ph!=='rules'&&ph!=='settings')drawTexts();
  if(G.paused){drawPause();ST(1,0,0,1,0,0);}
  if(G.howto!=null){drawHowto();ST(1,0,0,1,0,0);}
  syncPad();musicSync();
}

function goTitle(){G.phase='title';G.t=0;G.paused=false;pauseBtn.textContent='Pause';}
function setPause(v){G.paused=v;G.pmenu=0;pauseBtn.textContent=v?'Resume':'Pause';}
function openHowto(){G.howto=0;SFX.blip();}
function onPress(pl,btn){
  audio();
  let tapJump=true;if(btn==='stickup'){btn='up';tapJump=false;}
  if(btn==='help'){if(G.howto==null)openHowto();else G.howto=null;return;}
  if(G.howto!=null){
    if(btn==='left'||btn==='up'){G.howto=Math.max(0,G.howto-1);SFX.blip();}
    else if(btn==='right'||btn==='down'||btn==='tap'){if(G.howto<HOWTO.length-1){G.howto++;SFX.blip();}else if(btn==='tap')G.howto=null;}
    else if(btn==='attack'||btn==='start'||btn==='jump'){if(G.howto<HOWTO.length-1)G.howto++;else G.howto=null;SFX.blip();}
    else if(btn==='special'||btn==='pause')G.howto=null;
    return;
  }
  if(btn==='pause'){
    if(G.phase==='fight'||G.phase==='ready'){setPause(!G.paused);return;}
    if(G.phase==='select'||G.phase==='rules'||G.phase==='settings'){goTitle();return;}
    return;
  }
  if(G.paused){
    const n=PMENU().length;
    if(btn==='up'){G.pmenu=(G.pmenu+n-1)%n;SFX.blip();}
    else if(btn==='down'){G.pmenu=(G.pmenu+1)%n;SFX.blip();}
    else if(btn==='attack'||btn==='start'||btn==='jump')pauseSelect(G.pmenu);
    else if(btn==='special')setPause(false);
    return;
  }
  const ok=btn==='attack'||btn==='start'||(btn==='jump'&&G.phase!=='fight');
  switch(G.phase){
    case'title':
      if(btn==='up'){G.menu=(G.menu+MENU.length-1)%MENU.length;SFX.blip();}
      else if(btn==='down'){G.menu=(G.menu+1)%MENU.length;SFX.blip();}
      else if(ok)chooseMenu(G.menu);
      break;
    case'select':{
      const two=G.mode==='battle'&&G.rules.humans===2,p=two?pl:0;
      if(btn==='left'&&!G.lock[p]){G.sel[p]=(G.sel[p]+ROSTER.length-1)%ROSTER.length;SFX.blip();}
      else if(btn==='right'&&!G.lock[p]){G.sel[p]=(G.sel[p]+1)%ROSTER.length;SFX.blip();}
      else if(btn==='shield'){G.scale=G.scale==='canon'?'balanced':'canon';SFX.blip();}
      else if(btn==='special'){if(G.lock[p]){G.lock[p]=false;SFX.blip();}else if(G.mode==='battle'){G.phase='rules';G.t=0;}else goTitle();}
      else if(ok&&G.t>8){G.lock[p]=true;SFX.blip();if(!two||(G.lock[0]&&G.lock[1]))beginMode();}
      break;}
    case'rules':case'settings':{
      const isR=G.phase==='rules',rows=isR?RULEROWS:SETROWS,n=rows.length;let r=isR?G.rrow:G.srow;
      if(btn==='up')r=(r+n-1)%n;else if(btn==='down')r=(r+1)%n;
      else if(btn==='left'||btn==='right'){if(r<n-1)(isR?changeRule:changeSet)(r,btn==='left'?-1:1);}
      else if(ok){if(r===n-1){if(isR){G.lock=[false,false];G.phase='select';G.t=0;}else goTitle();}else(isR?changeRule:changeSet)(r,1);}
      else if(btn==='special')goTitle();
      if(isR)G.rrow=r;else G.srow=r;SFX.blip();break;}
    case'intro':if(ok&&G.t>30)startFight();break;
    case'result':
      if(G.t<40)break;
      if(G.mode==='arcade'){if(ok){if(G.res==='win'){if(G.stage<G.ladder.length-1)startMatch(G.stage+1);else{G.phase='ending';G.t=0;SFX.win();}}else{G.stats.continues++;startMatch(G.stage);}}}
      else{
        if(btn==='up'){G.rmenu=(G.rmenu+3)%4;SFX.blip();}else if(btn==='down'){G.rmenu=(G.rmenu+1)%4;SFX.blip();}
        else if(ok)resultSelect(G.rmenu);
      }
      break;
    case'ending':if(ok&&G.t>60)goTitle();break;
    case'fight':{const f=G.f[pl];if(f&&f.human)press(f,btn,tapJump);break;}
  }
}

      k: 'x.....x.x.......', s: '....x.......x...', h: 'x.x.x.x.x.x.x.x.' },

        ' D6:6 C#6:2 B5:2 A5:2 F#5:2 A5:2  A5:4 _:2 E5:1 F#5:1 G5:2 F#5:2 E5:2 C#5:2',
      bass: 'x..xo..xx.x.o.x.', arp: '0.2.1.2.3.2.1.2.',
      k: 'x.....x.x..x....', s: '....x.......x..x', h: 'xxxxxxxxxxxxxxxx' },
    { // 2 train yard: A minor, driving, i-VI-III-VII

        ' G5:3 E5:1 G5:2 C6:2 B5:2 G5:2 E5:4  D5:2 G5:2 B5:2 D6:6 B5:2 G5:2' +

        ' E5:1 E5:1 B5:2 E5:1 E5:1 C6:2 E5:1 E5:1 B5:2 A5:2 G5:2  F5:2 C6:2 A5:2 F6:4 E6:2 C6:2 A5:2' +

      bpm: 100, wave: 'triangle', lv: 0.45, echo: true, ch: 'Dm Bb Gm A Dm Bb Gm A',
      lead: '_:4 A5:8 F5:4  D6:12 _:4  _:4 G5:4 Bb5:4 A5:4  E5:12 _:4' +
        ' _:4 A5:8 D6:4  F6:8 E6:4 D6:4  Bb5:8 G5:4 D5:4  C#6:12 _:4',

  function parse(d){

    });
    const bl = [];
    for (let i = 0; i < 16; i++) {
      let j = i + 1;
      while (j < 16 && d.bass[j] === '.') j++;
      bl[i] = j - i;
    }
    return Object.assign({}, d, { chords: chords, lead: lead, bl: bl, len: chords.length * 16 });
  }
  const tracks = DEFS.map(parse);

  let ac = null, master = null, noiseBuf = null, pulse = null, dest = null;
  let enabled = true, ducked = false, ended = false;
  let want = -1, cur = -1, step = 0, nextT = 0, timer = null;

  function mf(m){ return 440 * Math.pow(2, (m - 69) / 12); }

  function init(ctx){
    ac = ctx;
    master = ctx.createGain();
    master.gain.value = ducked ? MASTER * 0.3 : MASTER;
    master.connect(ctx.destination);
    const n = Math.floor(ctx.sampleRate);
    noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
    // 25% duty pulse via Fourier series of a rectangular wave.
    const re = new Float32Array(32), im = new Float32Array(32), duty = 0.25;
    for (let k = 1; k < 32; k++) {
      re[k] = Math.sin(2 * Math.PI * k * duty) / (Math.PI * k);

    }

  }

  function tone(type, f, t, dur, vol){
    const o = ac.createOscillator(), g = ac.createGain();
    if (type === 'pulse') o.setPeriodicWave(pulse); else o.type = type;
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.linearRampToValueAtTime(vol * 0.6, t + Math.max(0.012, dur * 0.7));
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + dur + 0.02);
  }

  function kick(t){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.1);
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + 0.15);
  }

  function noise(t, ftype, freq, vol, dur){
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf;
    f.type = ftype;
    f.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.01);
  }

  function playStep(T, s, t, sd){
    const i = s & 15, c = T.chords[s >> 4], third = c.minor ? 3 : 4;
    const e = T.lead[s];
    if (e) tone(T.wave, mf(e[0]), t, e[1] * sd * 0.92, T.lv);
    const b = T.bass[i];
    if (b !== '.') tone('triangle', mf(36 + c.r + (b === 'o' ? 12 : b === 'f' ? 7 : 0)), t, T.bl[i] * sd * 0.85, 0.7);
    const a = T.arp[i];
    if (a !== '.') {
      const k = +a, m = 60 + c.r + [0, third, 7][k % 3] + 12 * Math.floor(k / 3);
      tone('square', mf(m), t, sd * 0.8, 0.08);
      if (T.echo) tone('square', mf(m), t + sd * 3, sd * 0.8, 0.03);
    }
    if (T.k[i] === 'x') kick(t);
    if (T.s[i] === 'x') noise(t, 'bandpass', 1800, 0.45, 0.12);
    if (T.h[i] === 'x') noise(t, 'highpass', 7000, 0.14, 0.035);
  }

  function release(g, ms){ setTimeout(function(){ try { g.disconnect(); } catch (err) { /* already gone */ } }, ms); }

  function fadeOut(d){
    if (dest && ac) {
      const now = ac.currentTime, p = dest.gain;
      p.cancelScheduledValues(now);
      p.setValueAtTime(p.value, now);
      p.linearRampToValueAtTime(0, now + d);
      release(dest, d * 1000 + 400);
    }
    dest = null; cur = -1;
  }

  function start(n){
    fadeOut(0.3);
    dest = ac.createGain();
    dest.gain.value = 1;
    dest.connect(master);
    cur = n; step = 0; nextT = ac.currentTime + 0.06;
  }

  function tick(){
    const ctx = getCtx();
    if (!ctx || ctx.state !== 'running') return;
    if (typeof document !== 'undefined' && document.hidden) return;
    if (ctx !== ac) init(ctx);
    if (!enabled || want < 0 || ended) { clearTimer(); return; }
    if (cur !== want) start(want);
    const T = tracks[cur], sd = 60 / T.bpm / 4;
    if (nextT < ctx.currentTime) nextT = ctx.currentTime + 0.02; // resync after hidden/suspended gaps
    while (nextT < ctx.currentTime + 0.2) {
      if (step >= T.len) {
        if (T.once) { ended = true; release(dest, 3000); dest = null; cur = -1; clearTimer(); return; }
        step = 0;
      }
      playStep(T, step, nextT, sd);
      step++; nextT += sd;
    }
  }

  function ensureTimer(){ if (!timer && enabled && want >= 0 && !ended) timer = setInterval(tick, 30); }
  function clearTimer(){ if (timer) { clearInterval(timer); timer = null; } }

  function play(track){
    if (!tracks[track] || track === want) return;
    want = track; ended = false;
    ensureTimer();
    tick();
  }
  function stop(){ want = -1; ended = false; fadeOut(0.4); clearTimer(); }
  function setEnabled(b){
    enabled = !!b;
    if (enabled) ensureTimer(); else { fadeOut(0.4); clearTimer(); }
  }
  function isEnabled(){ return enabled; }
  function duck(b){
    ducked = !!b;
    if (master && ac) {
      const now = ac.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setTargetAtTime(ducked ? MASTER * 0.3 : MASTER, now, 0.08);
    }
  }
  return { play: play, stop: stop, setEnabled: setEnabled, isEnabled: isEnabled, duck: duck };
}
